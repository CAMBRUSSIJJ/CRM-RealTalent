name: RealTalent Agent V5.2 Research Strategy QA
on:
  pull_request:
    branches:
      - feat/realtalent-agent-v5-1-tool-calling-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: Research module tests
        run: node --test runtime-host/RealTalent-Agent-Runtime-V3.1.2/crm-script-research-v52.test.mjs
      - name: Runtime syntax
        run: |
          node --check runtime-host/RealTalent-Agent-Runtime-V3.1.2/gateway-ollama.mjs
          node --check runtime-host/RealTalent-Agent-Runtime-V3.1.2/crm-script-research-v52.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Agent research and prior regression tests
        run: npx vitest run src/services/realtalent-agent-v52-research.test.ts src/services/realtalent-agent-v5-cognitive.test.ts src/services/realtalent-agent-v41-scripts.test.ts src/services/realtalent-agent-v4-intent.test.ts
      - name: Bundle
        run: npm run build
