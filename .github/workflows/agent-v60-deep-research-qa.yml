name: RealTalent Agent V6 — Deep Research QA
on:
  pull_request:
    branches:
      - feat/realtalent-agent-v56-research-editor-routing-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: Synthesis, search and SSRF guard
        run: |
          node --test runtime-host/RealTalent-Agent-Runtime-V3.1.2/crm-deep-research-v60.test.mjs
          node --test runtime-host/RealTalent-Agent-Runtime-V3.1.2/crm-research-v56.test.mjs
          node --check runtime-host/RealTalent-Agent-Runtime-V3.1.2/gateway-ollama.mjs
      - name: Frontend TypeScript
        run: npm run typecheck
      - name: Existing Agent conversation and research regressions
        run: npx vitest run src/services/realtalent-agent-v60-router.test.ts src/services/realtalent-agent-v56.test.ts src/services/realtalent-agent-v54-chat.test.ts src/services/realtalent-agent-v53.test.ts src/services/realtalent-agent-v4-conversation.test.ts
      - name: Validate Linux launcher
        run: bash -n scripts/agent-v60-linux/abrir-local.sh
      - name: Bundle
        run: npm run build
