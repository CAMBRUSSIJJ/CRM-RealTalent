name: RealTalent Agent V6.1 — Fluid Chat and Streaming QA
on:
  pull_request:
    branches:
      - feat/realtalent-agent-v60-deep-research-chat-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fluid-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: TypeScript
        run: npm run typecheck
      - name: Tests — stream, conversation, routing and previous agent
        run: |
          npx vitest run src/services/realtalent-agent-v61-stream.test.ts src/services/realtalent-agent-v61-conversation.test.ts src/services/realtalent-agent-v60-router.test.ts src/services/realtalent-agent-v56.test.ts src/services/realtalent-agent-v54-chat.test.ts src/services/realtalent-agent-v53.test.ts src/services/realtalent-agent-v4-conversation.test.ts
          node --test runtime-host/RealTalent-Agent-Runtime-V3.1.2/crm-deep-research-v60.test.mjs
      - name: Runtime syntax and Linux launcher
        run: |
          node --check runtime-host/RealTalent-Agent-Runtime-V3.1.2/gateway-ollama.mjs
          bash -n scripts/agent-v61-linux/abrir-local.sh
          grep -q -- '--port 4193 --strictPort' scripts/agent-v61-linux/abrir-local.sh
      - name: Build
        run: npm run build
