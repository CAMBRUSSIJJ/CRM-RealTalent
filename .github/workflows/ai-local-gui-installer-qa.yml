name: RealTalent IA Local GUI Installer QA
on:
  pull_request:
    branches:
      - feat/tasks-team-recipient-routing-20261102
    paths:
      - 'scripts/realtalent-ai-linux/gui/**'
      - '.github/workflows/ai-local-gui-installer-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify GUI and Bash installer
        run: node --test scripts/realtalent-ai-linux/gui/gui-installer-contract.test.mjs
