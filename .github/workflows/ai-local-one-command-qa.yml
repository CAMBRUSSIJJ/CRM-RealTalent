name: RealTalent AI Local One-Command QA
on:
  pull_request:
    branches:
      - feat/tasks-team-recipient-routing-20261102
    paths:
      - 'scripts/realtalent-ai-linux/**'
      - 'src/services/realtalent-ai-local-browser*'
      - 'src/features/settings/realtalent-ai-panel.tsx'
      - '.github/workflows/ai-local-one-command-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: CLI and local-only contracts
        run: node --test scripts/realtalent-ai-linux/ai-local-one-command.test.mjs
      - name: Local bridge security and pairing
        run: |
          node --test scripts/realtalent-ai-linux/browser-connector.test.mjs
          node --test scripts/realtalent-ai-linux/secure-bridge.test.mjs
          npx vitest run src/services/realtalent-ai-local-browser.test.ts
          node --test scripts/local-ai-vercel-csp.test.mjs
      - name: Compile and build
        run: |
          npm run typecheck
          npm run build
