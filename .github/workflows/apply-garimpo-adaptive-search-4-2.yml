name: Apply Garimpo Adaptive Search Learning 4.2

on:
  push:
    branches: [preview/v3.5-h1-semantic-agent]
    paths: ['.github/workflows/apply-garimpo-adaptive-search-4-2.yml']

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply Adaptive Search Learning 4.2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('runtime-host/RealTalent-CRM-V101.11.3-CR10-H1-Agent-V3.1.2-Linux-Launcher/scripts/realtalent-prospecting-agent.mjs')
          helper_path = runtime_path.with_name('realtalent-prospecting-adaptive-learning.mjs')
          client_path = Path('src/services/prospecting-linux-agent.ts')
          ci_path = Path('.github/workflows/preview-agent-ci.yml')
          smoke_path = Path('scripts/v101_11_3_h23_2_adaptive_search_learning_smoke.mjs')

          helper = r'''export const ADAPTIVE_LEARNING_VERSION = '4.2'

          const clean = (value) => String(value ?? '').trim().replace(/\s+/g, ' ')
          const norm = (value) => clean(value).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
          const round = (value) => Math.round(Math.max(0, Number(value) || 0) * 1000) / 1000
          const emptyMetric = () => ({ attempts: 0, discovered: 0, accepted: 0, rejected: 0, duplicates: 0, ready: 0, attention: 0, yieldRate: 0, duplicateRate: 0, qualityRate: 0, score: 0, state: 'learning', lastRunAt: null })

          export function emptyAdaptiveLearning() {
            return { version: ADAPTIVE_LEARNING_VERSION, perQuery: {}, perSource: {}, perCell: {}, bestQuery: null, bestSource: null, adaptations: [] }
          }

          const normalizeMetric = (raw = {}) => {
            const metric = { ...emptyMetric(), ...(raw || {}) }
            for (const key of ['attempts','discovered','accepted','rejected','duplicates','ready','attention']) metric[key] = Math.max(0, Number(metric[key]) || 0)
            recalc(metric)
            return metric
          }

          export function normalizeAdaptiveLearning(raw) {
            const learning = { ...emptyAdaptiveLearning(), ...(raw && typeof raw === 'object' ? raw : {}) }
            learning.version = ADAPTIVE_LEARNING_VERSION
            for (const bucket of ['perQuery','perSource','perCell']) {
              const source = learning[bucket] && typeof learning[bucket] === 'object' ? learning[bucket] : {}
              learning[bucket] = Object.fromEntries(Object.entries(source).map(([key, value]) => [key, normalizeMetric(value)]))
            }
            learning.adaptations = Array.isArray(learning.adaptations) ? learning.adaptations.slice(-80) : []
            learning.bestQuery = clean(learning.bestQuery) || null
            learning.bestSource = clean(learning.bestSource) || null
            return learning
          }

          export function captureAdaptiveCounters(job) {
            return {
              accepted: Math.max(0, Number(job?.stats?.unique) || 0),
              duplicates: Math.max(0, Number(job?.stats?.duplicates) || 0),
              rejected: Math.max(0, Number(job?.stats?.scopeRejectedCategory || 0) + Number(job?.stats?.scopeRejectedLocation || 0) + Number(job?.stats?.scopeRejectedOther || 0) + Number(job?.stats?.webRejectedDocuments || 0)),
              ready: Math.max(0, Number(job?.processing?.ready) || 0),
              attention: Math.max(0, Number(job?.processing?.attention) || 0),
            }
          }

          function recalc(metric) {
            const discovered = Math.max(1, metric.discovered)
            const accepted = Math.max(1, metric.accepted)
            metric.yieldRate = round(metric.accepted / discovered)
            metric.duplicateRate = round(metric.duplicates / discovered)
            metric.qualityRate = round((metric.ready + metric.attention * 0.35) / accepted)
            metric.score = round(metric.yieldRate * 0.58 + metric.qualityRate * 0.32 - metric.duplicateRate * 0.34)
            if (metric.discovered >= 5 && metric.duplicateRate >= 0.65) metric.state = 'duplicate_heavy'
            else if (metric.discovered >= 5 && metric.yieldRate < 0.15) metric.state = 'low_yield'
            else if (metric.discovered >= 5 && metric.yieldRate >= 0.5 && metric.accepted >= 2) metric.state = 'high_yield'
            else metric.state = 'learning'
          }

          function metricFor(learning, bucket, key) {
            const normalized = clean(key) || 'unknown'
            learning[bucket][normalized] = normalizeMetric(learning[bucket][normalized])
            return learning[bucket][normalized]
          }

          function addSample(metric, sample) {
            metric.attempts += 1
            for (const key of ['discovered','accepted','rejected','duplicates','ready','attention']) metric[key] += Math.max(0, Number(sample[key]) || 0)
            metric.lastRunAt = new Date().toISOString()
            recalc(metric)
          }

          function decision(learning, type, scope, key, message, metric) {
            const signature = `${type}:${scope}:${key}`
            if (learning.adaptations.some((item) => item.signature === signature)) return null
            const item = { id: `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`, signature, type, scope, key, message, at: new Date().toISOString(), metrics: { yieldRate: metric.yieldRate, duplicateRate: metric.duplicateRate, qualityRate: metric.qualityRate, score: metric.score, discovered: metric.discovered, accepted: metric.accepted } }
            learning.adaptations.push(item)
            learning.adaptations = learning.adaptations.slice(-80)
            return item
          }

          const delta = (after, before, key) => Math.max(0, Number(after?.[key] || 0) - Number(before?.[key] || 0))

          export function recordAdaptiveRun(job, context, before, after) {
            if (!job.runtime || typeof job.runtime !== 'object') job.runtime = {}
            const learning = job.runtime.learning = normalizeAdaptiveLearning(job.runtime.learning)
            const query = clean(context?.query)
            const source = clean(context?.source)
            const cellId = clean(context?.cellId)
            const sample = {
              discovered: Math.max(0, Number(context?.discovered) || 0),
              accepted: delta(after, before, 'accepted'),
              rejected: delta(after, before, 'rejected'),
              duplicates: delta(after, before, 'duplicates'),
              ready: delta(after, before, 'ready'),
              attention: delta(after, before, 'attention'),
            }
            const touched = []
            if (query) { const metric = metricFor(learning, 'perQuery', query); addSample(metric, sample); touched.push(['query', query, metric]) }
            if (source) { const metric = metricFor(learning, 'perSource', source); addSample(metric, sample); touched.push(['source', source, metric]) }
            if (cellId) { const metric = metricFor(learning, 'perCell', cellId); addSample(metric, sample); touched.push(['cell', cellId, metric]) }
            const decisions = []
            for (const [scope, key, metric] of touched) {
              let next = null
              if (metric.state === 'duplicate_heavy') next = decision(learning, 'stopped_duplicate_heavy', scope, key, `${scope === 'query' ? 'Consulta' : scope === 'source' ? 'Fonte' : 'Célula'} “${key}” ficou dominada por duplicidades e será evitada nas próximas tentativas.`, metric)
              else if (metric.state === 'low_yield') next = decision(learning, scope === 'source' ? 'deprioritized_source' : 'deprioritized_query', scope, key, `${scope === 'query' ? 'Consulta' : scope === 'source' ? 'Fonte' : 'Célula'} “${key}” teve baixo rendimento e perdeu prioridade.`, metric)
              else if (metric.state === 'high_yield') next = decision(learning, scope === 'source' ? 'promoted_source' : 'promoted_query', scope, key, `${scope === 'query' ? 'Consulta' : scope === 'source' ? 'Fonte' : 'Célula'} “${key}” está trazendo empresas válidas e ganhou prioridade.`, metric)
              if (next) decisions.push(next)
            }
            const rankedQueries = Object.entries(learning.perQuery).filter(([,m]) => m.attempts > 0).sort((a,b) => b[1].score - a[1].score)
            const rankedSources = Object.entries(learning.perSource).filter(([,m]) => m.attempts > 0).sort((a,b) => b[1].score - a[1].score)
            learning.bestQuery = rankedQueries[0]?.[0] || null
            learning.bestSource = rankedSources[0]?.[0] || null
            return { learning, sample, decisions }
          }

          export function getAdaptiveMetric(job, scope, key) {
            const learning = normalizeAdaptiveLearning(job?.runtime?.learning)
            const bucket = scope === 'query' ? learning.perQuery : scope === 'source' ? learning.perSource : learning.perCell
            return bucket[clean(key)] || null
          }

          export function adaptiveQueryPriority(job, query, explicitQuery = '') {
            const metric = getAdaptiveMetric(job, 'query', query)
            const explicit = norm(query) === norm(explicitQuery)
            if (explicit && (!metric || metric.attempts === 0)) return 10000
            if (!metric) return 100
            const stateBoost = metric.state === 'high_yield' ? 400 : metric.state === 'low_yield' ? -350 : metric.state === 'duplicate_heavy' ? -700 : 0
            return Math.round(metric.score * 1000) + stateBoost + (explicit ? 50 : 0)
          }

          export function shouldSkipAdaptiveQuery(job, query, explicitQuery = '') {
            const metric = getAdaptiveMetric(job, 'query', query)
            if (!metric) return false
            if (norm(query) === norm(explicitQuery) && metric.attempts === 0) return false
            return metric.state === 'low_yield' || metric.state === 'duplicate_heavy'
          }

          export function shouldStopAdaptiveSource(job, source) {
            const metric = getAdaptiveMetric(job, 'source', source)
            if (!metric || metric.attempts < 2 || metric.discovered < 10) return false
            return metric.state === 'low_yield' || metric.state === 'duplicate_heavy'
          }

          export function shouldSubdivideAdaptiveCell(job, cellId) {
            const metric = getAdaptiveMetric(job, 'cell', cellId)
            return Boolean(metric && metric.discovered >= 6 && metric.accepted >= 3 && metric.yieldRate >= 0.5 && metric.duplicateRate < 0.5)
          }
          '''.replace('\n          ', '\n').lstrip()
          helper_path.write_text(helper)

          runtime = runtime_path.read_text()
          import_anchor = "import { randomUUID, timingSafeEqual } from 'node:crypto'\n"
          adaptive_import = "import { adaptiveQueryPriority, captureAdaptiveCounters, emptyAdaptiveLearning, getAdaptiveMetric, normalizeAdaptiveLearning, recordAdaptiveRun, shouldSkipAdaptiveQuery, shouldStopAdaptiveSource, shouldSubdivideAdaptiveCell } from './realtalent-prospecting-adaptive-learning.mjs'\n"
          if adaptive_import not in runtime:
            assert import_anchor in runtime
            runtime = runtime.replace(import_anchor, import_anchor + adaptive_import, 1)

          runtime = runtime.replace("const COVERAGE_EXPANSION_VERSION = '21.1.0'", "const COVERAGE_EXPANSION_VERSION = '21.1.0'\nconst ADAPTIVE_SEARCH_VERSION = '4.2'", 1)

          events_anchor = "  counters: { discovered: 0, accepted: 0, ready: 0, attention: 0, rejectedCategory: 0, rejectedLocation: 0, duplicates: 0, queries: 0 },\n  events: [],"
          if "learning: emptyAdaptiveLearning()" not in runtime:
            assert events_anchor in runtime
            runtime = runtime.replace(events_anchor, "  counters: { discovered: 0, accepted: 0, ready: 0, attention: 0, rejectedCategory: 0, rejectedLocation: 0, duplicates: 0, queries: 0 },\n  learning: emptyAdaptiveLearning(),\n  events: [],", 1)

          ensure_anchor = "  job.runtime.counters = { ...emptyRuntimeTruth(job.id).counters, ...(job.runtime.counters || {}) }\n  return job.runtime"
          if "job.runtime.learning = normalizeAdaptiveLearning" not in runtime:
            assert ensure_anchor in runtime
            runtime = runtime.replace(ensure_anchor, "  job.runtime.counters = { ...emptyRuntimeTruth(job.id).counters, ...(job.runtime.counters || {}) }\n  job.runtime.learning = normalizeAdaptiveLearning(job.runtime.learning)\n  return job.runtime", 1)

          append_end = "  runtime.events = runtime.events.slice(-80)\n  return runtime\n}\nfunction setRuntimePhase"
          if "function emitAdaptiveDecisions" not in runtime:
            assert append_end in runtime
            runtime = runtime.replace(append_end, "  runtime.events = runtime.events.slice(-80)\n  return runtime\n}\nfunction emitAdaptiveDecisions(job, outcome) {\n  for (const item of outcome?.decisions || []) appendRuntimeEvent(job, item.type, item.message, { adaptiveVersion: ADAPTIVE_SEARCH_VERSION, scope: item.scope, key: item.key, metrics: item.metrics })\n  return outcome\n}\nfunction setRuntimePhase", 1)

          normalize_runtime_anchor = "      runtime.counters = { ...emptyRuntimeTruth(job.id).counters, ...(runtime.counters || {}) }\n      return runtime"
          if "runtime.learning = normalizeAdaptiveLearning(runtime.learning)" not in runtime:
            assert normalize_runtime_anchor in runtime
            runtime = runtime.replace(normalize_runtime_anchor, "      runtime.counters = { ...emptyRuntimeTruth(job.id).counters, ...(runtime.counters || {}) }\n      runtime.learning = normalizeAdaptiveLearning(runtime.learning)\n      return runtime", 1)

          norm_input_anchor = "      searchCenter: Number.isFinite(Number(job.input?.searchCenter?.lat)) && Number.isFinite(Number(job.input?.searchCenter?.lon))\n        ? { lat: Number(job.input.searchCenter.lat), lon: Number(job.input.searchCenter.lon) } : null,\n    },"
          if "semanticPlan: job.input?.semanticPlan" not in runtime:
            assert norm_input_anchor in runtime
            runtime = runtime.replace(norm_input_anchor, "      searchCenter: Number.isFinite(Number(job.input?.searchCenter?.lat)) && Number.isFinite(Number(job.input?.searchCenter?.lon))\n        ? { lat: Number(job.input.searchCenter.lat), lon: Number(job.input.searchCenter.lon) } : null,\n      semanticPlan: job.input?.semanticPlan && typeof job.input.semanticPlan === 'object' ? job.input.semanticPlan : null,\n    },", 1)

          plan_anchor = "      geometry: job.plan?.geometry || null,\n      plannedAt: job.plan?.plannedAt || null,"
          if "semanticPlan: job.plan?.semanticPlan" not in runtime:
            assert plan_anchor in runtime
            runtime = runtime.replace(plan_anchor, "      geometry: job.plan?.geometry || null,\n      semanticPlan: job.plan?.semanticPlan || job.input?.semanticPlan || null,\n      plannedAt: job.plan?.plannedAt || null,", 1)

          create_input_anchor = "      searchCenter: Number.isFinite(Number(input.searchCenter?.lat)) && Number.isFinite(Number(input.searchCenter?.lon))\n        ? { lat: Number(input.searchCenter.lat), lon: Number(input.searchCenter.lon) } : null,\n    },"
          if "semanticPlan: input.semanticPlan" not in runtime:
            assert create_input_anchor in runtime
            runtime = runtime.replace(create_input_anchor, "      searchCenter: Number.isFinite(Number(input.searchCenter?.lat)) && Number.isFinite(Number(input.searchCenter?.lon))\n        ? { lat: Number(input.searchCenter.lat), lon: Number(input.searchCenter.lon) } : null,\n      semanticPlan: input.semanticPlan && typeof input.semanticPlan === 'object' ? input.semanticPlan : null,\n    },", 1)

          create_plan_anchor = "    plan: { expandedQueries: [], ontology: buildSearchOntologyPlan(input.segment), cells: [], providerRuns: [], geometry: null, plannedAt: null },"
          if create_plan_anchor in runtime:
            runtime = runtime.replace(create_plan_anchor, "    plan: { expandedQueries: [], ontology: buildSearchOntologyPlan(input.segment), cells: [], providerRuns: [], geometry: null, semanticPlan: input.semanticPlan && typeof input.semanticPlan === 'object' ? input.semanticPlan : null, plannedAt: null },", 1)

          old_build = """async function buildSearchPlan(job) {
  job.plan.ontology = buildSearchOntologyPlan(job.input.segment)
  job.plan.expandedQueries = job.input.categoryMode === 'related' ? job.plan.ontology.webTerms : uniqueTerms([job.input.segment, ...(job.plan.ontology.strictTerms || [])], 10)
  job.plan.cells = []
  job.plan.providerRuns = []
  job.plan.geometry = null
  job.plan.plannedAt = now()
"""
          new_build = """async function buildSearchPlan(job) {
  job.plan.ontology = buildSearchOntologyPlan(job.input.segment)
  const semanticPlan = job.input.semanticPlan && typeof job.input.semanticPlan === 'object' ? job.input.semanticPlan : null
  const semanticQueries = Array.isArray(semanticPlan?.queries) ? semanticPlan.queries.map(clean).filter(Boolean) : []
  const deterministicQueries = job.input.categoryMode === 'related' ? job.plan.ontology.webTerms : [job.input.segment, ...(job.plan.ontology.strictTerms || [])]
  job.plan.semanticPlan = semanticPlan
  // A consulta explícita permanece na frente; a IA pode ampliar, nunca substituir a intenção do usuário.
  job.plan.expandedQueries = uniqueTerms([job.input.segment, ...semanticQueries, ...deterministicQueries], 12)
  job.plan.cells = []
  job.plan.providerRuns = []
  job.plan.geometry = null
  job.plan.plannedAt = now()
"""
          if old_build in runtime:
            runtime = runtime.replace(old_build, new_build, 1)
          else:
            assert "const semanticPlan = job.input.semanticPlan" in runtime

          osm_before = "  const before = job.results.length\n  let exactElements = []"
          if "const adaptiveBefore = captureAdaptiveCounters(job)" not in runtime:
            assert osm_before in runtime
            runtime = runtime.replace(osm_before, "  const before = job.results.length\n  const adaptiveBefore = captureAdaptiveCounters(job)\n  let exactElements = []", 1)

          osm_added = "  const added = job.results.length - before\n  cell.uniqueResultsFound = added"
          if "source: 'openstreetmap', cellId: cell.id" not in runtime[runtime.index('async function runOsmCell'):runtime.index('async function runWebPlanner')]:
            assert osm_added in runtime
            runtime = runtime.replace(osm_added, "  const added = job.results.length - before\n  const adaptiveOutcome = recordAdaptiveRun(job, { query: job.input.segment, source: 'openstreetmap', cellId: cell.id, region: cell.region, discovered: elements.length, explicitQuery: true }, adaptiveBefore, captureAdaptiveCounters(job))\n  emitAdaptiveDecisions(job, adaptiveOutcome)\n  cell.uniqueResultsFound = added", 1)

          subdivision_anchor = "  const canSubdivideByLimit = leafCount + 3 <= MAX_SEARCH_CELLS\n  if (cell.mode === 'bbox' && exactElements.length >= DENSE_CELL_THRESHOLD && canSubdivideByDepth && canSubdivideByArea && canSubdivideByLimit && !shouldStopForTarget(job)) {"
          if "const adaptiveCellHot = shouldSubdivideAdaptiveCell" not in runtime:
            assert subdivision_anchor in runtime
            runtime = runtime.replace(subdivision_anchor, "  const canSubdivideByLimit = leafCount + 3 <= MAX_SEARCH_CELLS\n  const adaptiveCellHot = shouldSubdivideAdaptiveCell(job, cell.id)\n  if (cell.mode === 'bbox' && (exactElements.length >= DENSE_CELL_THRESHOLD || adaptiveCellHot) && canSubdivideByDepth && canSubdivideByArea && canSubdivideByLimit && !shouldStopForTarget(job)) {", 1)

          start = runtime.index('async function runWebPlanner(job, seen) {')
          end = runtime.index('\nasync function discoverOsmForRegion', start)
          new_web = r'''async function runWebPlanner(job, seen) {
  if (!WEB_SEARCH_ENABLED || shouldStopForTarget(job)) return
  const seenWebDocuments = new Set()
  for (const region of job.input.regions) {
    const pending = [...job.plan.expandedQueries]
    while (pending.length) {
      await waitIfPaused(job)
      if (shouldStopForTarget(job)) return
      if (shouldStopAdaptiveSource(job, 'web')) {
        appendRuntimeEvent(job, 'stopped_low_yield', 'Busca web interrompida cedo porque o rendimento desta fonte ficou baixo ou dominado por duplicidades.', { provider: 'web', adaptiveVersion: ADAPTIVE_SEARCH_VERSION })
        return
      }
      pending.sort((a, b) => adaptiveQueryPriority(job, b, job.input.segment) - adaptiveQueryPriority(job, a, job.input.segment))
      const term = pending.shift()
      if (!term) continue
      if (shouldSkipAdaptiveQuery(job, term, job.input.segment)) {
        appendRuntimeEvent(job, 'adaptive_skip', `Consulta “${term}” foi pulada após rendimento insuficiente nas tentativas anteriores.`, { provider: 'web', query: term, region, adaptiveVersion: ADAPTIVE_SEARCH_VERSION })
        continue
      }
      const before = job.results.length
      const adaptiveBefore = captureAdaptiveCounters(job)
      let adaptiveDiscovered = 0
      let completedAdaptiveRun = false
      job.progress.currentRegion = region
      job.progress.currentSource = 'Busca web pública'
      job.progress.currentUrl = ''
      job.message = `Expandindo busca: “${term}” em ${region}…`
      setRuntimePhase(job, 'discovering_web', job.message, 'web')
      ensureRuntimeTruth(job).currentQuery = term
      await saveState()
      try {
        job.stats.queries += 1
        const limit = job.input.searchMode === 'fast' ? 10 : job.input.searchMode === 'economy' ? 14 : 24
        const results = await searchWeb(term, region, limit)
        adaptiveDiscovered = results.length
        completedAdaptiveRun = true
        job.stats.discovered += results.length
        job.stats.webDocuments = Number(job.stats.webDocuments || 0) + results.length
        let acceptedPlaces = 0
        let rejectedDocuments = 0
        for (const result of results) {
          await waitIfPaused(job)
          if (shouldStopForTarget(job)) break
          const documentKey = clean(result.url).replace(/#.*$/, '').replace(/\/$/, '').toLowerCase()
          if (documentKey && seenWebDocuments.has(documentKey)) { job.stats.duplicates += 1; continue }
          if (documentKey) seenWebDocuments.add(documentKey)
          const classified = await webPlaceDraft(result, region, job)
          if (!classified.draft) {
            if (classified.classification?.rejectType === 'category') recordScopeRejection(job, { name: result.title, provider: 'web_discovery' }, { rejectType: 'category', reason: classified.classification.rejectReason })
            else if (classified.classification?.rejectType === 'location') recordScopeRejection(job, { name: result.title, provider: 'web_discovery' }, { rejectType: 'location', reason: classified.classification.rejectReason })
            else rejectedDocuments += 1
            await sleep(TEST_MODE ? 1 : 60); continue
          }
          if (classified.draft.coverageCandidate) {
            const coverageHintsUsed = (job.results || []).filter((candidate) => candidate.provider === 'web_coverage_hint').length
            if (coverageHintsUsed >= COVERAGE_HINT_LIMIT) {
              rejectedDocuments += 1
              appendRuntimeEvent(job, 'coverage_limit', `Limite de ${COVERAGE_HINT_LIMIT} pistas web de cobertura atingido; os demais diretórios ficam apenas no diagnóstico.`, { provider: 'web', query: term, region })
              continue
            }
          }
          acceptedPlaces += 1
          await processDiscoveredDraft(job, classified.draft, seen)
          await sleep(TEST_MODE ? 1 : 100)
        }
        job.stats.webPlaceCandidates = Number(job.stats.webPlaceCandidates || 0) + acceptedPlaces
        job.stats.webRejectedDocuments = Number(job.stats.webRejectedDocuments || 0) + rejectedDocuments
        job.plan.providerRuns.push({ provider: 'web', cellId: null, query: term, intentId: job.plan.ontology?.intentId || 'generic', region, startedAt: now(), status: 'completed', results: results.length, localCandidates: acceptedPlaces, rejectedDocuments })
        appendRuntimeEvent(job, 'source_result', `Web “${term}” retornou ${results.length} documento(s), com ${acceptedPlaces} candidato(s) local(is).`, { provider: 'web', query: term, region, results: results.length, acceptedPlaces })
      } catch (error) {
        const message = `Busca web “${term}” em ${region}: ${error instanceof Error ? error.message : String(error)}`
        job.warnings.push(message)
        job.plan.providerRuns.push({ provider: 'web', cellId: null, query: term, intentId: job.plan.ontology?.intentId || 'generic', region, startedAt: now(), status: 'failed', error: message, results: 0 })
        appendRuntimeEvent(job, 'warning', message, { provider: 'web', query: term, region })
      }
      if (completedAdaptiveRun) {
        const adaptiveOutcome = recordAdaptiveRun(job, { query: term, source: 'web', region, discovered: adaptiveDiscovered, explicitQuery: normalize(term) === normalize(job.input.segment) }, adaptiveBefore, captureAdaptiveCounters(job))
        emitAdaptiveDecisions(job, adaptiveOutcome)
        const lastRun = job.plan.providerRuns[job.plan.providerRuns.length - 1]
        const metric = getAdaptiveMetric(job, 'query', term)
        if (lastRun?.provider === 'web' && lastRun.query === term && metric) Object.assign(lastRun, { adaptiveYieldRate: metric.yieldRate, adaptiveQualityRate: metric.qualityRate, adaptiveState: metric.state })
      }
      const added = job.results.length - before
      recordCoverageRun(job, added)
      await saveState()
      if (job.input.targetMode === 'max' && job.coverage.territoryPercent >= 100 && job.coverage.lastNewCounts.length >= SATURATION_WINDOW && job.coverage.saturationPercent >= 94 && job.coverage.lastNewCounts.slice(-3).every((value) => value <= 1)) return
    }
  }
}
'''
          runtime = runtime[:start] + new_web + runtime[end:]
          runtime_path.write_text(runtime)

          client = client_path.read_text()
          iface_anchor = "export interface ProspectingSemanticPlan { intent: string; queries: string[]; exclusions: string[]; planner: string }\n"
          adaptive_types = """export interface ProspectingAdaptiveMetric { attempts: number; discovered: number; accepted: number; rejected: number; duplicates: number; ready: number; attention: number; yieldRate: number; duplicateRate: number; qualityRate: number; score: number; state: 'learning' | 'low_yield' | 'duplicate_heavy' | 'high_yield'; lastRunAt: string | null }
export interface ProspectingAdaptiveDecision { id: string; signature: string; type: string; scope: 'query' | 'source' | 'cell'; key: string; message: string; at: string; metrics: { yieldRate: number; duplicateRate: number; qualityRate: number; score: number; discovered: number; accepted: number } }
export interface ProspectingAdaptiveLearning { version: string; perQuery: Record<string, ProspectingAdaptiveMetric>; perSource: Record<string, ProspectingAdaptiveMetric>; perCell: Record<string, ProspectingAdaptiveMetric>; bestQuery: string | null; bestSource: string | null; adaptations: ProspectingAdaptiveDecision[] }
"""
          if 'export interface ProspectingAdaptiveLearning' not in client:
            assert iface_anchor in client
            client = client.replace(iface_anchor, iface_anchor + adaptive_types, 1)
          runtime_type_anchor = "    counters: { discovered: number; accepted: number; ready: number; attention: number; rejectedCategory: number; rejectedLocation: number; duplicates: number; queries: number }\n    events:"
          if 'learning?: ProspectingAdaptiveLearning' not in client:
            assert runtime_type_anchor in client
            client = client.replace(runtime_type_anchor, "    counters: { discovered: number; accepted: number; ready: number; attention: number; rejectedCategory: number; rejectedLocation: number; duplicates: number; queries: number }\n    learning?: ProspectingAdaptiveLearning\n    events:", 1)
          client_path.write_text(client)

          smoke = r'''import assert from 'node:assert/strict'
          import { adaptiveQueryPriority, captureAdaptiveCounters, emptyAdaptiveLearning, getAdaptiveMetric, recordAdaptiveRun, shouldSkipAdaptiveQuery, shouldStopAdaptiveSource, shouldSubdivideAdaptiveCell } from '../runtime-host/RealTalent-CRM-V101.11.3-CR10-H1-Agent-V3.1.2-Linux-Launcher/scripts/realtalent-prospecting-adaptive-learning.mjs'
          const job = { runtime: { learning: emptyAdaptiveLearning() }, stats: { unique: 0, duplicates: 0, scopeRejectedCategory: 0, scopeRejectedLocation: 0, scopeRejectedOther: 0, webRejectedDocuments: 0 }, processing: { ready: 0, attention: 0 } }
          assert.equal(shouldSkipAdaptiveQuery(job, 'Barbearias', 'Barbearias'), false, 'consulta explícita precisa ser tentada')
          let before = captureAdaptiveCounters(job)
          job.stats.scopeRejectedCategory = 6
          recordAdaptiveRun(job, { query: 'barber shop porto alegre', source: 'web', discovered: 6 }, before, captureAdaptiveCounters(job))
          assert.equal(shouldSkipAdaptiveQuery(job, 'barber shop porto alegre', 'Barbearias'), true, 'consulta de baixo rendimento deve perder prioridade')
          before = captureAdaptiveCounters(job)
          job.stats.unique += 4; job.processing.ready += 3
          recordAdaptiveRun(job, { query: 'barbearia porto alegre', source: 'web', cellId: 'cell-hot', discovered: 6 }, before, captureAdaptiveCounters(job))
          assert.equal(getAdaptiveMetric(job, 'query', 'barbearia porto alegre').state, 'high_yield')
          assert.equal(shouldSubdivideAdaptiveCell(job, 'cell-hot'), true, 'célula de alto rendimento deve poder subdividir')
          assert.ok(adaptiveQueryPriority(job, 'barbearia porto alegre', 'Barbearias') > adaptiveQueryPriority(job, 'barber shop porto alegre', 'Barbearias'))
          before = captureAdaptiveCounters(job)
          job.stats.duplicates += 7
          recordAdaptiveRun(job, { query: 'lista de barbearias', source: 'web-duplicate-test', discovered: 8 }, before, captureAdaptiveCounters(job))
          assert.equal(shouldSkipAdaptiveQuery(job, 'lista de barbearias', 'Barbearias'), true, 'consulta dominada por duplicidade deve parar')
          before = captureAdaptiveCounters(job)
          job.stats.scopeRejectedCategory += 6
          recordAdaptiveRun(job, { query: 'ruim 2', source: 'web-low', discovered: 6 }, before, captureAdaptiveCounters(job))
          before = captureAdaptiveCounters(job)
          job.stats.scopeRejectedCategory += 6
          recordAdaptiveRun(job, { query: 'ruim 3', source: 'web-low', discovered: 6 }, before, captureAdaptiveCounters(job))
          assert.equal(shouldStopAdaptiveSource(job, 'web-low'), true, 'fonte persistente de baixo rendimento deve parar cedo')
          assert.equal(job.runtime.learning.version, '4.2')
          assert.ok(job.runtime.learning.adaptations.length >= 3)
          console.log('Garimpo Adaptive Search Learning 4.2 smoke: OK')
          '''.replace('\n          ', '\n').lstrip()
          smoke_path.write_text(smoke)

          ci = ci_path.read_text()
          ci_anchor = "      - name: Prospecting Intelligence regression\n        run: npx vitest run src/services/prospecting-data-layer.test.ts src/services/prospecting-intelligence.test.ts src/services/prospecting-search-automation.test.ts"
          if 'v101_11_3_h23_2_adaptive_search_learning_smoke.mjs' not in ci:
            assert ci_anchor in ci
            ci = ci.replace(ci_anchor, ci_anchor + "\n\n      - name: Garimpo Adaptive Search Learning 4.2 smoke\n        run: node scripts/v101_11_3_h23_2_adaptive_search_learning_smoke.mjs", 1)
          ci_path.write_text(ci)
          PY
      - name: Install
        run: npm ci --include=dev
      - name: Adaptive learning smoke
        run: node scripts/v101_11_3_h23_2_adaptive_search_learning_smoke.mjs
      - name: Prospecting regression
        run: npx vitest run src/services/prospecting-data-layer.test.ts src/services/prospecting-intelligence.test.ts src/services/prospecting-search-automation.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Migration integrity
        run: npm run migrations:verify
      - name: Commit validated implementation
