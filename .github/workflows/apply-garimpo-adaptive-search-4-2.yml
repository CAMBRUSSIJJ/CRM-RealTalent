name: Apply Garimpo Adaptive Search Learning 4.2

on:
  push:
    branches:
      - preview/v3.5-h1-semantic-agent
    paths:
      - '.github/workflows/apply-garimpo-adaptive-search-4-2.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply patch
        run: python3 .github/scripts/apply-garimpo-adaptive-search-4-2.py
      - name: Install
        run: npm ci --include=dev
      - name: Adaptive learning smoke
        run: node scripts/v101_11_3_h23_2_adaptive_search_learning_smoke.mjs
      - name: Prospecting regression
        run: npx vitest run src/services/prospecting-data-layer.test.ts src/services/prospecting-intelligence.test.ts src/services/prospecting-search-automation.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Migration integrity
        run: npm run migrations:verify
      - name: Commit validated implementation
        run: |
          rm -f .github/workflows/apply-garimpo-adaptive-search-4-2.yml
          rm -f .github/scripts/apply-garimpo-adaptive-search-4-2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: Garimpo Adaptive Search Learning 4.2'
          git push origin HEAD:preview/v3.5-h1-semantic-agent
