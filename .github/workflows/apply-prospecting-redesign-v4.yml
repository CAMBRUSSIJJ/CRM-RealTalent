name: Apply Garimpo Redesign V4

on:
  push:
    branches:
      - preview/v3.5-h1-semantic-agent
    paths:
      - .github/workflows/apply-prospecting-redesign-v4.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: preview/v3.5-h1-semantic-agent
          fetch-depth: 0

      - name: Wire redesign into real Prospecting workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/features/prospecting/prospecting-page.tsx')
          text = p.read_text()

          anchor = "import { buildProspectingIcp, prospectingIcpSummary, rankProspects } from '../../services/prospecting-intelligence'"
          addition = "\nimport { ProspectingRedesignSearch, ProspectingRedesignShell } from './prospecting-redesign'\nimport '../../styles/prospecting-redesign-v4.css'"
          if "ProspectingRedesignShell" not in text:
              if anchor not in text:
                  raise SystemExit('prospecting intelligence import anchor not found')
              text = text.replace(anchor, anchor + addition, 1)

          start_marker = '  return (\n    <div className="page-stack prospecting-page prospecting-page-h20">'
          results_marker = "      {tab === 'results' ? <div className=\"prospecting-review-workspace-v101103-h7 prospecting-review-workspace-v101106\">"
          modal_marker = '      <SendToCrmModal'
          end_function_marker = '\n}\n\n\nfunction ProspectingIntelligencePanel'

          start = text.find(start_marker)
          results = text.find(results_marker, start)
          modal = text.find(modal_marker, results)
          fn_end = text.find(end_function_marker, modal)
          if min(start, results, modal, fn_end) < 0:
              raise SystemExit(f'return markers not found: start={start} results={results} modal={modal} fn_end={fn_end}')

          result_history = text[results:modal]
          modal_footer = text[modal:fn_end]

          new_prefix = '''  return (
    <div className="page-stack prospecting-page prospecting-page-h20 prospecting-page-v4">
      <input
        ref={fileInputRef}
        type="file"
        accept=".csv,.json,text/csv,application/json"
        hidden
        onChange={(event) => {
          const file = event.target.files?.[0]
          if (file) void importFile(file)
        }}
      />

      <ProspectingRedesignShell
        activeTab={tab === 'results' ? 'results' : tab === 'history' ? 'history' : 'search'}
        reviewCount={metrics.attention}
        sentCount={metrics.sent}
        suggestionSegment={prospectingIcp?.segments[0]?.value ?? ''}
        suggestionCity={prospectingIcp?.cities[0]?.value ?? ''}
        canCreate={canProspectingCreate}
        onImport={() => fileInputRef.current?.click()}
        onNewSearch={() => {
          setTab('search')
          window.setTimeout(() => document.getElementById('prospecting-linux-segment')?.focus(), 0)
        }}
        onUseSuggestion={() => {
          if (prospectingIcp?.segments[0]?.value) setSegment(prospectingIcp.segments[0].value)
          if (prospectingIcp?.cities[0]?.value) changeProspectingCity(prospectingIcp.cities[0].value)
          setTab('search')
        }}
        onSearchTab={() => setTab('search')}
        onReviewTab={() => setTab('results')}
        onCrm={() => setRoute('leads')}
        onHistoryTab={() => setTab('history')}
      >
        {tab === 'search' || tab === 'local' ? <>
          <ProspectingRedesignSearch
            segment={segment}
            city={city}
            quantity={quantity}
            categoryMode={categoryMode}
            areaMode={areaMode}
            radiusKm={radiusKm}
            canEdit={canProspectingEdit}
            agentBusy={agentBusy}
            agentHealth={agentHealth}
            job={agentJob}
            baseTotal={metrics.total}
            sentCount={metrics.sent}
            readyCount={metrics.autoValidatable}
            attentionCount={metrics.attention}
            onSegment={setSegment}
            onCity={changeProspectingCity}
            onQuantity={setQuantity}
            onCategoryMode={setCategoryMode}
            onAreaMode={(value) => { setAreaMode(value); if (value !== 'map') setMapPolygon([]) }}
            onRadiusKm={setRadiusKm}
            onStart={() => void startLinuxAgentSearch()}
            onControl={(action) => void controlLinuxAgentSearch(action)}
            onDetails={() => setShowTechnical((value) => !value)}
          />
          {showTechnical && agentJob ? <div className="prospecting-redesign-v4__legacy-content">
            <EngineProcessingWorkspace
              job={agentJob}
              busy={agentBusy}
              onRefresh={() => void refreshAgent()}
              onRetry={(candidateId, taskId) => void retryEnrichmentTask(candidateId, taskId)}
              onOpenReview={() => setTab('results')}
            />
          </div> : null}
        </> : null}
'''

          new_suffix = '''
      </ProspectingRedesignShell>
'''

          text = text[:start] + new_prefix + result_history + new_suffix + modal_footer + text[fn_end:]
          p.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Prospecting tests
        run: npx vitest run src/services/prospecting-search-automation.test.ts src/services/prospecting-intelligence.test.ts src/services/prospecting-data-layer.test.ts

      - name: Build
        run: npm run build

      - name: Commit integrated redesign
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/prospecting/prospecting-page.tsx
          git commit -m "feat: integrate exact Garimpo redesign with live engine"
          git push origin HEAD:preview/v3.5-h1-semantic-agent
