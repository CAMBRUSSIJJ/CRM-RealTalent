name: Apply Garimpo Redesign V4

on:
  push:
    branches:
      - preview/v3.5-h1-semantic-agent
    paths:
      - .github/workflows/apply-prospecting-redesign-v4.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: preview/v3.5-h1-semantic-agent
          fetch-depth: 0

      - name: Wire redesign into Prospecting workspace
        run: python3 scripts/apply_prospecting_redesign_v4.py

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Prospecting tests
        run: npx vitest run src/services/prospecting-search-automation.test.ts src/services/prospecting-intelligence.test.ts src/services/prospecting-data-layer.test.ts

      - name: Build
        run: npm run build

      - name: Commit integrated redesign
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/prospecting/prospecting-page.tsx
          git commit -m "feat: integrate exact Garimpo redesign with live engine"
          git push origin HEAD:preview/v3.5-h1-semantic-agent
