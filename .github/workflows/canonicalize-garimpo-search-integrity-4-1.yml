name: Canonicalize Garimpo Search Integrity 4.1 CSS

on:
  push:
    branches:
      - preview/v3.5-h1-semantic-agent
    paths:
      - '.github/workflows/canonicalize-garimpo-search-integrity-4-1.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Preview
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move redesign styles into canonical Garimpo layer
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/features/prospecting/prospecting-page.tsx')
          workspace = Path('src/styles/prospecting-workspace.css')
          legacy = Path('src/styles/prospecting-redesign-v4.css')

          page_text = page.read_text()
          page_text = page_text.replace("import '../../styles/prospecting-redesign-v4.css'\n", '')
          page.write_text(page_text)

          if legacy.exists():
              css = legacy.read_text()
              css = css.replace('max-width:1240px', 'max-width:1480px')
              css = css.replace('grid-template-columns:420px minmax(0,1fr)', 'grid-template-columns:430px minmax(0,1fr)')
              marker = '/* Garimpo Search Integrity 4.1 — canonical redesign layer */'
              current = workspace.read_text()
              if marker not in current:
                  workspace.write_text(current.rstrip() + '\n\n' + marker + '\n' + css.rstrip() + '\n')
              legacy.unlink()
          PY

      - name: Validate CSS governance
        run: node scripts/css_governance_audit.mjs

      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/canonicalize-garimpo-search-integrity-4-1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: canonicalize Garimpo Search Integrity 4.1 styles'
          git push origin HEAD:preview/v3.5-h1-semantic-agent
