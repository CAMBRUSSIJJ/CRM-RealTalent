name: RealTalent Cloud Ollama Bridge QA
on:
  push:
    branches:
      - fix/ollama-vercel-bridge-20261031
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npx vitest run src/services/realtalent-agent-v56-health.test.ts
      - run: npm run build
