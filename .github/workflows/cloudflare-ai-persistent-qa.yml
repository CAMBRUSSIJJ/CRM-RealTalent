name: RealTalent AI Persistent Cloudflare Bridge QA
on:
  push:
    branches:
      - feat/realtalent-ai-persistent-cloudflare-20261031
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: node --test scripts/cloudflare-agent-access.test.mjs
      - run: bash -n scripts/realtalent-ai-linux/start-linux.sh
      - run: bash -n scripts/realtalent-ai-linux/configurar-tunnel.sh
      - run: node --test scripts/realtalent-ai-linux/secure-bridge.test.mjs
      - run: npm run typecheck
      - run: npm run build
