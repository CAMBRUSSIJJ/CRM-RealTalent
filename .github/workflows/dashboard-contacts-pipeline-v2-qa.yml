name: RealTalent CRM UX V3 Follow-ups Comunicação Tarefas e Métricas QA

on:
  push:
    branches:
      - feat/ux-v2-dashboard-contacts-pipeline-20261103
  pull_request:
    paths:
      - 'src/features/dashboard/dashboard*'
      - 'src/features/leads/contacts-v3.css'
      - 'src/features/leads/leads-page.tsx'
      - 'src/features/leads/lead-form.tsx'
      - 'src/features/leads/create-lead-modal.tsx'
      - 'src/features/leads/opportunity-create-v3.css'
      - 'scripts/opportunity-modal-v3.test.mjs'
      - 'src/features/tasks/task-modal.tsx'
      - 'src/features/tasks/tasks-page.tsx'
      - 'src/features/communications/communications-page.tsx'
      - 'src/features/communications/communications-central-v3.css'
      - 'scripts/communications-central-v3.test.mjs'
      - 'src/features/metrics/metrics-page.tsx'
      - 'src/features/metrics/metrics-v3.css'
      - 'scripts/metrics-dashboard-v3.test.mjs'
      - 'src/features/settings/whatsapp-integration-panel.tsx'
      - 'src/features/communications/whatsapp-connection-center.tsx'
      - 'src/services/communication-workspace-core.ts'
      - 'src/services/communication-workspace-core.test.ts'
      - 'src/services/whatsapp-workspace-core.ts'
      - 'src/services/whatsapp-workspace-core.test.ts'
      - 'scripts/communications-live-revision.mjs'
      - 'scripts/communications-live-revision.test.mjs'
      - 'scripts/communications-qr-live-contract.test.mjs'
      - 'scripts/realtalent-communications-gateway.mjs'
      - 'scripts/communications-store-utils.mjs'
      - 'runtime-host/RealTalent-CRM-V101.11.3-CR10-H1-Agent-V3.1.2-Linux-Launcher/scripts/realtalent-communications-gateway.mjs'
      - 'runtime-host/RealTalent-CRM-V101.11.3-CR10-H1-Agent-V3.1.2-Linux-Launcher/scripts/communications-store-utils.mjs'
      - 'runtime-host/RealTalent-CRM-V101.11.3-CR10-H1-Agent-V3.1.2-Linux-Launcher/scripts/communications-live-revision.mjs'
      - 'src/features/communications/whatsapp-chat-panel.tsx'
      - 'src/services/local-communications-gateway.ts'
      - 'api/runtime/_proxy.mjs'
      - 'api/runtime/_proxy.test.mjs'
      - 'scripts/hosted-whatsapp-qr-regression.test.mjs'
      - 'src/features/followups/followups-page.tsx'
      - 'src/features/followups/followups-v3.css'
      - 'scripts/followups-page-v3.test.mjs'
      - 'src/features/tasks/tasks-page-v4.css'
      - 'scripts/tasks-page-v4.test.mjs'
      - 'scripts/v101_11_2_teams_tasks_foundation_audit.mjs'
      - 'src/features/tasks/task-board-v3.css'
      - 'scripts/tasks-unified-board-v3.test.mjs'
      - 'src/features/pipeline/sales-pipeline-v3.css'
      - 'src/features/pipeline/pipeline-page.tsx'
      - 'scripts/ux-v2-sales-workspaces.test.mjs'
      - '.github/workflows/dashboard-contacts-pipeline-v2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sales-v2-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-sales-workspaces-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout completo para comparar eventos antes e depois
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias com lockfile
        run: npm ci --include=dev
      - name: Testar contratos visuais e funcionais sem mocks
        run: node --test scripts/ux-v2-sales-workspaces.test.mjs
      - name: Verificar nova oportunidade V3
        run: node --test scripts/opportunity-modal-v3.test.mjs
      - name: Testar quadro unico de tarefas V3
        run: node --test scripts/tasks-unified-board-v3.test.mjs
      - name: Verificar layout unico de Tarefas V4
        run: node --test scripts/tasks-page-v4.test.mjs
      - name: Testar ponte entre WhatsApp QR Railway e Supabase hospedado
        run: npx vitest run src/services/communication-workspace-core.test.ts --reporter=dot
      - name: Testar envio WhatsApp QR no Vercel sem interferir na Cloud API
        run: npx vitest run src/services/whatsapp-workspace-core.test.ts --reporter=dot
      - name: Verificar WhatsApp QR envio assíncrono e atualização em tempo real
        run: |
          node --check scripts/realtalent-communications-gateway.mjs
          node --check runtime-host/RealTalent-CRM-V101.11.3-CR10-H1-Agent-V3.1.2-Linux-Launcher/scripts/realtalent-communications-gateway.mjs
          node --test scripts/communications-live-revision.test.mjs
          node --test scripts/communications-qr-live-contract.test.mjs
          node --test scripts/v101_8_4_h9_communications_reliability_smoke.mjs
      - name: Testar Central de Comunicacao V3
        run: node --test scripts/communications-central-v3.test.mjs
      - name: Testar Dashboard de Metricas V3
        run: node --test scripts/metrics-dashboard-v3.test.mjs
      - name: Testar Central de Follow-ups V3
        run: node --test scripts/followups-page-v3.test.mjs
      - name: Validar WhatsApp QR Code hospedado e protecao do pareamento
        run: |
          node --test scripts/hosted-whatsapp-qr-regression.test.mjs
          node --test api/runtime/_proxy.test.mjs
      - name: Auditar dependencias de producao (sem upgrades forçados)
        run: npm audit --omit=dev --audit-level=high
      - name: Validar sintaxe e imports do CRM
        run: npm run typecheck
      # O projeto usa tsconfig.typecheck.json para o app de produção.
      # tsconfig.app.json inclui testes legados que já possuem erros TS independentes desta alteração.
      - name: Suite de testes do repositorio
        run: npx vitest run src --reporter=dot
      # Scripts/*.test.mjs usam node:test, já coberto por execução separada;
      # o runner Vitest não deve tratá-los como suites do Vitest.
      - name: Compilar aplicacao Vite completa
        run: npm run build
