name: RealTalent Dashboard, Contatos e Pipeline V2 QA

on:
  push:
    branches:
      - feat/ux-v2-dashboard-contacts-pipeline-20261103
  pull_request:
    paths:
      - 'src/features/dashboard/dashboard*'
      - 'src/features/leads/contacts-layout-v2.css'
      - 'src/features/leads/leads-page.tsx'
      - 'src/features/pipeline/pipeline-layout-v2.css'
      - 'src/features/pipeline/pipeline-page.tsx'
      - 'scripts/ux-v2-sales-workspaces.test.mjs'
      - '.github/workflows/dashboard-contacts-pipeline-v2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sales-v2-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-sales-workspaces-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout completo para comparar eventos antes e depois
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias com lockfile
        run: npm ci --include=dev
      - name: Testar contratos visuais e funcionais sem mocks
        run: node --test scripts/ux-v2-sales-workspaces.test.mjs
      - name: Validar sintaxe e imports do CRM
        run: npm run typecheck
      - name: TypeScript da aplicacao
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Suite de testes do repositorio
        run: npm test -- --reporter=dot
      - name: Compilar aplicacao Vite completa
        run: npm run build
