name: Backup criptografado do banco

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

concurrency:
  group: database-backup-production
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: node scripts/backup_database.mjs
      - name: Criptografar
        shell: bash
        run: |
          DUMP=$(find backups -name '*.dump' -type f | head -1)
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}" --symmetric --cipher-algo AES256 "$DUMP"
          rm -f "$DUMP"
      - uses: actions/upload-artifact@v4
        with:
          name: realtalent-database-backup-${{ github.run_id }}
          path: backups
          if-no-files-found: error
          retention-days: 7
