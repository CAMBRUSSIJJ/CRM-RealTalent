name: Publicar e homologar staging V100.42

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      VITE_DATA_MODE: supabase
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      STAGING_URL: ${{ secrets.STAGING_URL }}
      STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
      STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
      STAGING_TEST_EMAIL_A: ${{ secrets.STAGING_TEST_EMAIL_A }}
      STAGING_TEST_PASSWORD_A: ${{ secrets.STAGING_TEST_PASSWORD_A }}
      STAGING_TEST_EMAIL_B: ${{ secrets.STAGING_TEST_EMAIL_B }}
      STAGING_TEST_PASSWORD_B: ${{ secrets.STAGING_TEST_PASSWORD_B }}
      VITE_RELEASE_CHANNEL: staging
      VITE_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r requirements-smoke.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run homologate
      - name: Publicar banco e funções
        shell: bash
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx supabase db lint --linked --level warning
          npx supabase db push --linked --include-all --yes
          FUNCTIONS=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -printf '%f ')
          npx supabase functions deploy $FUNCTIONS --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Acionar deploy do frontend
        run: curl --fail --silent --show-error --request POST "${{ secrets.VERCEL_STAGING_DEPLOY_HOOK }}"
      - name: Aguardar release publicada
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            VERSION=$(curl -fsS "$STAGING_URL/health.json?attempt=$attempt" | python -c "import sys,json; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
            [ "$VERSION" = "100.42" ] && exit 0
            sleep 10
          done
          echo "A release V100.42 não ficou disponível no prazo." >&2
          exit 1
      - run: npm run verify:staging
      - run: npm run test:e2e
      - run: npm run test:tenant
      - uses: actions/upload-artifact@v4
        with:
          name: realtalent-v100-41-staging-report
          path: |
            STAGING-VERIFICATION-V100-42.json
            E2E-STAGING-V100-42.json
            TENANT-ISOLATION-V100-42.json
            HOMOLOGATION-REPORT-V100-42.json
            test-results
          if-no-files-found: error
          retention-days: 30
