name: Publicar Supabase

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente protegido do GitHub
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: supabase-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:ci
      - name: Vincular projeto
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migrations
        run: npx supabase db push --linked --include-all --yes
      - name: Definir segredo do runner
        run: npx supabase secrets set "AUTOMATION_CRON_SECRET=${{ secrets.AUTOMATION_CRON_SECRET }}" --project-ref "$SUPABASE_PROJECT_REF"
      - name: Publicar Edge Functions
        run: npx supabase functions deploy extension-ingest automation-runner --project-ref "$SUPABASE_PROJECT_REF" --use-api
