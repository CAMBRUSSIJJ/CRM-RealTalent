name: Publicar Supabase V100.42

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente protegido do GitHub
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: supabase-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run homologation:static
      - name: Vincular projeto
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Validar banco vinculado
        run: npx supabase db lint --linked --level warning
      - name: Aplicar migrations
        run: npx supabase db push --linked --include-all --yes
      - name: Definir secrets operacionais
        run: >-
          npx supabase secrets set
          "AUTOMATION_CRON_SECRET=${{ secrets.AUTOMATION_CRON_SECRET }}"
          "AUTOMATION_WEBHOOK_CRON_SECRET=${{ secrets.AUTOMATION_WEBHOOK_CRON_SECRET }}"
          "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}"
          --project-ref "$SUPABASE_PROJECT_REF"
      - name: Publicar todas as Edge Functions versionadas
        shell: bash
        run: |
          FUNCTIONS=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -printf '%f ')
          test -n "$FUNCTIONS"
          npx supabase functions deploy $FUNCTIONS --project-ref "$SUPABASE_PROJECT_REF" --use-api
