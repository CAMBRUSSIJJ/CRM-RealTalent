name: Export Garimpo patch ZIP
on:
  push:
    branches:
      - preview/garimpo-functional-consolidation
    paths:
      - .github/workflows/export-garimpo-overlay.yml
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: preview/garimpo-functional-consolidation
          fetch-depth: 0
      - name: Create verified Garimpo overlay ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, zipfile, hashlib, json
          base="66941092ab543cbe277b290a5d28dcf610b783b4"
          head="c117d67aaceedb926e3fe7baee26e20eb0108f20"
          def git(*a):return subprocess.check_output(["git",*a])
          entries=[];removed=[]
          for line in git("diff","--name-status",base,head).decode().strip().splitlines():
              typ,path=line.split("\t",1)
              if typ.startswith("D"):removed.append(path)
              else:entries.append((path,git("show",f"{head}:{path}")))
          instruction="""REAL TALENT CRM - CORRECAO GARIMPO / PREVIEW c117d67
          ==================================================
          ESTE E UM COMPLEMENTO. Nao e o CRM completo.
          Base de referencia: 66941092ab543cbe277b290a5d28dcf610b783b4

          1. Extraia seu ZIP do CRM para uma pasta.
          2. Extraia ESTE ZIP na raiz da pasta do CRM, preservando as pastas.
             Sobrescreva os arquivos com o mesmo nome.
          3. Apague scripts/patch-preview-cloud-prospecting-ui.mjs (se existir).
          4. Na pasta raiz do CRM, execute:
             npm ci
             npm run typecheck
             npm run qa:prospecting:functional
             npm run build
          5. Compacte a pasta inteira num novo ZIP.

          IMPORTANTE: use a mesma base de codigo. Misturar com ZIP de
          versao antiga pode causar erros. O pacote nao faz deploy.
          O Garimpo cloud ainda depende de runtime online configurado.
          """
          manifest={"base_commit":base,"target_commit":head,
              "included_files":[{"path":p,"sha256":hashlib.sha256(b).hexdigest(),"size_bytes":len(b)} for p,b in entries],
              "remove_files":removed}
          target=Path("downloads/RealTalent-Garimpo-Correcao-Preview-c117d67.zip")
          target.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(target,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=8) as z:
              for name,blob in entries:z.writestr(name,blob)
              z.writestr("INSTRUCOES-PARA-COLOCAR-NO-ZIP.txt",instruction)
              z.writestr("MANIFESTO-ARQUIVOS.json",json.dumps(manifest,ensure_ascii=False,indent=2))
          with zipfile.ZipFile(target) as z:
              assert z.testzip() is None
              assert len(entries)==10 and len(removed)==1
          print("ZIP",target,"size",target.stat().st_size,"files",len(entries))
          PY
      - name: Commit binary download
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/RealTalent-Garimpo-Correcao-Preview-c117d67.zip
          git commit -m "build(artifact): Garimpo correction overlay ZIP"
          git push origin HEAD:preview/garimpo-functional-consolidation
