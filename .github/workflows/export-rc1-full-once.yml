name: Export RealTalent RC1 Full CRM
on:
  push:
    branches:
      - exports/realtalent-rc1-full-preview
    paths:
      - .github/workflows/export-rc1-full-once.yml
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: exports/realtalent-rc1-full-preview
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: node scripts/rc1-preview-gate.mjs
      - run: npm run qa:prospecting:functional
      - run: node scripts/prospecting-human-review-audit.mjs
      - run: npx vite build
      - name: Create full source ZIP and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,zipfile,json,hashlib
          source='5512f333ee92e8ba20344e183d054c1f36585034'
          names=subprocess.check_output(['git','ls-tree','-rz','--name-only',source]).decode().split('\0')
          excludes=('.github/', 'downloads/', '.preview-patches/', 'node_modules/', '.git/', 'dist/', 'coverage/', '.vercel/')
          entries=[]
          for name in names:
              if not name or name.startswith(excludes): continue
              if '/node_modules/' in name or '/.git/' in name:continue
              p=Path(name)
              if not p.is_file():raise SystemExit('Missing tracked file: '+name)
              bn=p.name.lower()
              if bn in ('.env','.env.production','.env.local','.env.development','id_rsa','id_ed25519'):continue
              if bn.startswith('.env.') and not bn.endswith('.example'):continue
              if bn.endswith(('.pem','.p12','.pfx','.key')):continue
              entries.append(name)
          required=('package.json','package-lock.json','vercel.json','index.html',
            'src/features/prospecting/prospecting-page.tsx',
            'src/features/prospecting/prospecting-raw-source-review.tsx',
            'src/features/prospecting/prospecting-evidence-explorer.tsx',
            'api/runtime/_proxy.mjs','scripts/rc1-preview-gate.mjs')
          assert len(entries)>3000,(len(entries))
          assert all(p in entries for p in required)
          out=Path('downloads/RealTalent-CRM-RC1-COMPLETO-Preview-2026-10-17.zip')
          out.parent.mkdir(parents=True,exist_ok=True)
          readme='''REAL TALENT CRM — RC1 PREVIEW (CODIGO-FONTE COMPLETO)
          =================================================
          Commit: 5512f333ee92e8ba20344e183d054c1f36585034
          STATUS: Validado por TypeScript, gates funcionais e build; NAO APROVADO PARA PRODUCTION.
          ESTE ZIP E O CODIGO-FONTE COMPLETO, nao o build compilado.
          
          PASSOS:
          1. Extrair este ZIP para uma pasta VAZIA, preservando src/, api/,
             scripts/, public/ e todos os arquivos raiz.
          2. No Debian: cd <pasta> && npm ci && npm run typecheck
          3. Para publicar Preview, configure a equipe e o projeto na CLI:
             npx vercel login
             npx vercel link
             Selecione o projeto crm-real-talent EXISTENTE.
             Confirme as variaveis de ambiente do Preview no painel.
             npx vercel deploy
          4. Use o URL de Preview gerado para testar login, mapa, fonte bruta,
             revisao, sincronizacao e envio seguro ao CRM.
          
          NUNCA USAR --prod ANTES DE CONCLUIR A HOMOLOGACAO.
          
          CUIDADOS:
          - Esta versao depende do Supabase e dos runtimes externos existentes.
          - O runtime do Garimpo tem codigo separado e deploy separado; o ZIP
            inclui fonte, mas NAO provisiona um Sandbox Vercel automaticamente.
          - Vercel Deployment Protection entre projetos requer autenticacao
            de servico configurada; um link compartilhado nao e solucao.
          - Preview e Production podem compartilhar dados no Supabase.
          - rawSourceDecisions ainda sao locais ao navegador.
          - O runtime mantem historico via Sandbox/snapshots; nao use isso
            como substituto de persistencia duravel no banco.
          - Se a Vercel retornar 402 api-deployments-free-per-day, a cota
            da equipe precisa ser liberada antes de outro deploy.
          '''
          manifest={'source_commit':source,'files':len(entries),
                    'checksums':{n:hashlib.sha256(Path(n).read_bytes()).hexdigest() for n in entries}}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=8,allowZip64=True) as z:
              for name in entries:z.write(name,name)
              z.writestr('LEIA-ME-RC1-VERCEL.txt',readme)
              z.writestr('MANIFESTO-RC1.json',json.dumps(manifest,ensure_ascii=False,indent=2))
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert set(required).issubset(set(z.namelist()))
          print('RC1 FULL:',len(entries),'files; ZIP',out.stat().st_size,'bytes')
          assert out.stat().st_size<90_000_000
          PY
      - name: Commit artifact without one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/export-rc1-full-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build(export): full RC1 Preview CRM source ZIP"
          git push origin HEAD:exports/realtalent-rc1-full-preview
