name: Export RealTalent CRM RC1 H1
on:
  push:
    branches:
      - exports/realtalent-rc1-h1-tested-zip
    paths:
      - .github/workflows/export-rc1-h1-once.yml
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: exports/realtalent-rc1-h1-tested-zip
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: node scripts/rc1-h1-persistence-gate.mjs
      - run: npx vitest run src/services/prospecting-persistence-safety.test.ts --reporter=dot
      - run: npx vite build
      - name: Package the entire reviewed source tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,zipfile,json,hashlib
          source='dac5da2f067ee913573ce085badc8a96d426a8d3'
          names=subprocess.check_output(['git','ls-tree','-rz','--name-only',source]).decode().split('\0')
          excluded=('.github/','downloads/','.preview-patches/','node_modules/','.git/','dist/','coverage/','.vercel/')
          files=[]
          for name in names:
              if not name or name.startswith(excluded) or any('/'+d in name for d in ('node_modules/','.git/','dist/')):continue
              path=Path(name)
              if not path.is_file():raise RuntimeError('Tracked file missing: '+name)
              base=path.name.lower()
              if base in ('.env','.env.local','.env.production','.env.development','id_rsa','id_ed25519'):continue
              if base.startswith('.env.') and not base.endswith('.example'):continue
              if base.endswith(('.pem','.p12','.pfx','.key')):continue
              files.append(name)
          required=['package.json','package-lock.json','vercel.json','index.html',
             'src/features/prospecting/prospecting-page.tsx',
             'src/features/prospecting/prospecting-raw-source-review.tsx',
             'src/services/prospecting-workspace.ts',
             'src/services/prospecting-persistence-safety.test.ts',
             'api/runtime/_proxy.mjs']
          assert len(files)>3000, len(files)
          assert all(name in files for name in required)
          out=Path('downloads/RealTalent-CRM-RC1-H1-COMPLETO-Preview.zip')
          out.parent.mkdir(parents=True,exist_ok=True)
          guide='''REALTALENT CRM RC1-H1 - CODIGO-FONTE COMPLETO - PREVIEW
          ===================================================
          Commit dac5da2f067ee913573ce085badc8a96d426a8d3
          Arquivo completo do frontend, API, runtime-host, public, src, scripts,
          package.json, package-lock.json e vercel.json.
          Nao inclui builds antigos, node_modules nem credenciais.
          
          CORRECAO CRITICA:
          - Sincronizacao do Garimpo nao apaga mais registros ausentes do navegador.
          - Sincroniza apenas registros alterados (nao sobrepoe a carteira toda).
          - Excluir exige lista explicita de IDs e retorno do servidor.
          - Carga inicial do Supabase nao aciona sincronizacao destrutiva.
          - O teste de OAuth cloud considera /api/runtime/communications valido.
          
          HOMOLOGACAO:
          - CI: TypeScript, gates do Garimpo, 852+ testes (consultar CI da branch),
            build Vite. Validacao funcional em navegador AUTENTICADO pendente.
          - Production nao atualizada.
          - Runtime Garimpo hospedado separado: codigo de origem nao equivale
            a um deploy ativo na Vercel.
          - Como Preview pode compartilhar Supabase real, NAO faca testes
            destrutivos com dados reais sem uma base isolada.
          
          USAR NA VERCEL:
          1. Extraia o ZIP completo numa pasta VAZIA no Debian.
          2. Abra o terminal na pasta: npm ci && npm run typecheck
          3. Execute npx vercel login e npx vercel link, escolhendo o
             projeto existente crm-real-talent na equipe correta.
          4. Confira as variaveis Preview no painel (nunca copie tokens ao ZIP).
          5. Execute npx vercel deploy (PREVIEW); nao utilize --prod.
          6. Verifique Login, Contatos, Pipeline, Tarefas, Agenda,
             Garimpo (buscar, mapa, revisao, fontes), Agent, Comunicacoes
             e persistencia apos reload.
          7. Se Vercel responder 402, espere a liberacao de cota.
          '''
          manifest={'source_commit':source,
            'source_files':len(files),'sha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=8) as z:
            for path in files:z.write(path,path)
            z.writestr('LEIA-ME-RC1-H1-VERCEL.txt',guide)
            z.writestr('MANIFESTO-COMPLETO-RC1-H1.json',json.dumps(manifest,ensure_ascii=False,indent=2))
          with zipfile.ZipFile(out) as z:assert z.testzip() is None
          assert out.stat().st_size<90_000_000
          print('RC1 H1 complete ZIP',out.stat().st_size,'bytes;',len(files),'files')
          PY
      - name: Commit artifact and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/export-rc1-h1-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build(export): RC1 H1 safe complete CRM ZIP"
          git push origin HEAD:exports/realtalent-rc1-h1-tested-zip
