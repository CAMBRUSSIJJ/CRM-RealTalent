name: Export RealTalent Functional Recovery 1.0 — complete ZIP
on:
  push:
    branches:
      - exports/functional-recovery-1-0-local-zip
    paths:
      - .github/workflows/functional-recovery-export-once.yml
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: exports/functional-recovery-1-0-local-zip
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install, check, and test
        run: |
          npm ci --include=dev
          npm run typecheck
          npm run qa:functional-recovery
          npm test -- --reporter=dot
          npx vite build
      - name: Create complete standalone ZIP (no deployment)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,zipfile,hashlib,json
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          omitted_prefixes=('downloads/','node_modules/','dist/','.preview-patches/','.vercel/','.git/','coverage/')
          omitted_files={'.github/workflows/functional-recovery-export-once.yml','.env','.env.local','.env.production'}
          sources=[]
          for name in files:
            if not name or name in omitted_files or name.startswith(omitted_prefixes):continue
            if '/node_modules/' in name or '/.git/' in name:continue
            path=Path(name)
            if not path.is_file():continue
            leaf=path.name.lower()
            if leaf.startswith('.env.') and not leaf.endswith('.example'):continue
            if leaf.endswith(('.pem','.p12','.pfx','.key')) or leaf in ('id_rsa','id_ed25519'):continue
            sources.append(name)
          required=['package.json','package-lock.json','vercel.json','index.html','src/features/settings/integration-readiness-panel.tsx','src/services/integration-runtime-diagnostics.ts','src/services/integration-runtime-diagnostics.test.ts','src/services/prospecting-workspace.ts','supabase/functions/integration-oauth-start/index.ts','supabase/functions/official-communication-send/index.ts']
          assert len(sources)>3000,('too few files',len(sources))
          assert all(p in sources for p in required),'missing mandatory file'
          folder=Path('downloads');folder.mkdir(exist_ok=True)
          output=folder/'RealTalent-CRM-FUNCTIONAL-RECOVERY-1.0-COMPLETO.zip'
          manifest={'base_production_commit':'dac5da2f067ee913573ce085badc8a96d426a8d3',
             'export_commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),
             'version':'Functional Recovery 1.0 — local testing only',
             'file_count':len(sources),
             'sha256_files':{s:hashlib.sha256(Path(s).read_bytes()).hexdigest() for s in sources}}
          with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED,compresslevel=8,allowZip64=True) as z:
            for name in sources:z.write(name,name)
            z.writestr('MANIFESTO-FUNCTIONAL-RECOVERY-1.0.json',json.dumps(manifest,ensure_ascii=False,indent=2))
          with zipfile.ZipFile(output) as z:
            assert z.testzip() is None
            assert all(p in z.namelist() for p in required)
          assert output.stat().st_size<95000000,'Unexpectedly large ZIP'
          print('COMPLETE ZIP:',output,'bytes',output.stat().st_size,'files',len(sources))
          PY
      - name: Commit ZIP and remove temporary workflow
        run: |
          rm -f .github/workflows/functional-recovery-export-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build(export): full Functional Recovery 1.0 local test ZIP"
          git push origin HEAD:exports/functional-recovery-1-0-local-zip
