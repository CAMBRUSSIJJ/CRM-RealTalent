name: RealTalent Intelligence — RS CNPJ pilot QA
on:
  push:
    branches: [feat/realtalent-intelligence-cnpj-rs-pilot-20261118, feat/garimpo-recheck-filters-v2-20261118, feat/realtalent-qsa-people-intelligence-20261118, feat/garimpo-identify-cnpj-investigation-20261118, feat/garimpo-public-cnpj-fallback-20261118]
  pull_request:
    branches: [feat/garimpo-clean-hosted-20261118, feat/realtalent-intelligence-cnpj-rs-pilot-20261118, feat/garimpo-recheck-filters-v2-20261118, feat/realtalent-qsa-people-intelligence-20261118, feat/garimpo-identify-cnpj-investigation-20261118]
permissions:
  contents: read
jobs:
  index-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned engine
        run: python -m pip install -c garimpo-engine/requirements.lock ./garimpo-engine
      - name: Python unit + hosted API contract
        run: PYTHONPATH=garimpo-engine python -m unittest discover -s garimpo-engine/tests -p 'test_company_index.py' -v
      - name: Recheck Python authorization and source-safety contracts
        run: PYTHONPATH=garimpo-engine python -m unittest discover -s garimpo-engine/tests -p 'test_recheck.py' -v
      - name: QSA official ZIP import, privacy and API regressions
        run: PYTHONPATH=garimpo-engine python -m unittest discover -s garimpo-engine/tests -p 'test_qsa_import.py' -v
      - name: Exact-company identification and restricted CNPJ matching
        run: PYTHONPATH=garimpo-engine python -m unittest discover -s garimpo-engine/tests -p 'test_identity.py' -v
      - name: Public CNPJ lookup fallback security, attribution and response normalization
        run: PYTHONPATH=garimpo-engine python -m unittest discover -s garimpo-engine/tests -p 'test_public_company_lookup.py' -v
      - name: Check Python syntax
        run: python -m py_compile garimpo-engine/garimpo/company_index_import.py garimpo-engine/garimpo/hosted.py garimpo-engine/garimpo/extraction.py garimpo-engine/garimpo/qsa_import.py garimpo-engine/garimpo/company_identity.py garimpo-engine/garimpo/public_company_lookup.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npx vitest run src/features/garimpo/review.test.ts src/features/garimpo/recheck.test.ts src/features/garimpo/company-identity.test.ts
      - run: npm run build
