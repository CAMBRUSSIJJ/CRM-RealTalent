name: Garimpo Data Visibility Release
on:
  push:
    branches:
      - preview/garimpo-data-visibility
    paths:
      - .github/workflows/garimpo-data-visibility-once.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/garimpo-data-visibility
          fetch-depth: 0
      - name: Apply reviewed change set
        shell: bash
        run: |
          gzip -dc .preview-patches/garimpo-data-visibility.patch.gz | git apply --check -
          gzip -dc .preview-patches/garimpo-data-visibility.patch.gz | git apply -
          node --check scripts/realtalent-prospecting-agent.mjs
          node --check runtime-host/RealTalent-CRM-V101.11.3-CR10-H1-Agent-V3.1.2-Linux-Launcher/scripts/realtalent-prospecting-agent.mjs
      - name: Validate preview
        shell: bash
        run: |
          npm ci --include=dev
          npm run typecheck
          npm run qa:prospecting:functional
          npx vite build
      - name: Create correction overlay for existing ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,zipfile,json,hashlib
          base="c117d67aaceedb926e3fe7baee26e20eb0108f20"
          result=Path("downloads/RealTalent-Garimpo-Dados-Completos-Preview.zip")
          result.parent.mkdir(parents=True,exist_ok=True)
          changed=subprocess.check_output(["git","diff","--name-only","--diff-filter=ACM",base]).decode().strip().splitlines()
          newfile="src/features/prospecting/prospecting-evidence-explorer.tsx"
          if newfile not in changed:changed.append(newfile)
          paths=sorted(p for p in set(changed) if Path(p).is_file() and not p.startswith(".preview-patches/") and not p.startswith(".github/"))
          files=[{"path":p,"sha256":hashlib.sha256(Path(p).read_bytes()).hexdigest()} for p in paths]
          note="""REAL TALENT - GARIMPO DADOS E EVIDENCIAS
          ======================================
          Patch para a versao base c117d67 (Preview).
          Nao e o CRM inteiro.
          1. Extraia o seu ZIP do CRM numa pasta.
          2. Extraia este ZIP na raiz dessa pasta e substitua os arquivos.
          3. Preserve a arvore src/, scripts/ e runtime-host/.
          4. Nao copie para dist/ ou node_modules/.
          5. Rode npm ci, npm run typecheck e npm run build no ambiente configurado.
          6. Compacte novamente a pasta completa.
          Se o seu ZIP nao usa esta base, prefira a versao completa do Preview.
          A busca cloud exige runtime configurado.
          """
          with zipfile.ZipFile(result,"w",zipfile.ZIP_DEFLATED,compresslevel=8) as z:
            for p in paths:z.write(p,p)
            z.writestr("LEIA-ME-GARIMPO.txt",note)
            z.writestr("MANIFESTO-GARIMPO.json",json.dumps({"base":base,"files":files},indent=2))
          with zipfile.ZipFile(result) as z:assert z.testzip() is None
          assert len(paths)>=6,(len(paths),paths)
          print("Created",result,result.stat().st_size,"bytes with",len(paths),"source files")
          PY
      - name: Commit canonical source and remove one-time workflow
        shell: bash
        run: |
          rm -f .preview-patches/garimpo-data-visibility.patch.gz
          rm -f .github/workflows/garimpo-data-visibility-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(garimpo): inspect commercial data, sources and filtered evidence"
          git push origin HEAD:preview/garimpo-data-visibility
