name: Garimpo Functional Consolidation

on:
  push:
    branches:
      - preview/garimpo-functional-consolidation
    paths:
      - .github/workflows/garimpo-functional-consolidation.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/garimpo-functional-consolidation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply validated Garimpo consolidation
        run: node scripts/apply-garimpo-functional-consolidation.mjs

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Functional consolidation gate
        run: npm run qa:prospecting:functional

      - name: H21 runtime-truth gate
        run: npm run qa:v101.11.3:h21.1

      - name: Strict scope smoke
        run: npm run runtime:prospecting-strict-scope
        env:
          REALTALENT_PROSPECTING_AGENT_HOST: 127.0.0.1

      - name: Territory engine smoke
        run: npm run runtime:prospecting-territory2
        env:
          REALTALENT_PROSPECTING_AGENT_HOST: 127.0.0.1

      - name: Local discovery smoke
        run: npm run runtime:prospecting-local
        env:
          REALTALENT_PROSPECTING_AGENT_HOST: 127.0.0.1

      - name: Progressive processing smoke
        run: npm run runtime:prospecting-progressive
        env:
          REALTALENT_PROSPECTING_AGENT_HOST: 127.0.0.1

      - name: Commit consolidated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(prospecting): consolidate real map and functional search"
          git push origin HEAD:preview/garimpo-functional-consolidation
