name: RealTalent S3.6 — WhatsApp Quiet Send QA
on:
  pull_request:
    branches:
      - feat/realtalent-agent-v64-local-memory-20261028
      - feat/realtalent-garimpo-g1g2-investigation-20261028
      - feat/realtalent-garimpo-g3-conversational-20261028
      - feat/realtalent-r1-fluxo-comercial-inteligente-20261029
      - feat/realtalent-settings-s1s2-automation-ux-20261029
      - feat/realtalent-settings-s3-visual-navigation-20261029
      - feat/realtalent-settings-s33-smart-forms-20261029
      - feat/realtalent-settings-s331-pipeline-editor-20261029
      - fix/realtalent-settings-s34-calendar-whatsapp-20261029
      - fix/realtalent-s35-runtime-stability-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  garimpo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: TypeScript
        run: npm run typecheck
      - name: G1/G2 safety and regression tests
        run: |
          npx vitest run src/features/prospecting/prospecting-raw-source-review.test.ts src/services/prospecting-g1g2-intelligence.test.ts src/services/prospecting-intelligence.test.ts src/services/prospecting-data-layer.test.ts src/services/prospecting-search-automation.test.ts src/services/realtalent-agent-garimpo-bridge.test.ts src/services/prospecting-handoff-r1.test.ts src/features/settings/preferences-context.test.ts src/features/settings/settings-automation-policy.test.ts src/features/settings/settings-s3-navigation.test.ts src/features/settings/settings-smart-forms.test.ts src/features/settings/pipeline-editor-s331.test.ts src/lib/integration-availability-s34.test.ts src/features/communications/whatsapp-send-feedback.test.ts
          node --test runtime-host/RealTalent-Agent-Runtime-V3.1.2/crm-prospect-investigation-g1.test.mjs
          node --test runtime-host/RealTalent-Agent-Runtime-V3.1.2/crm-garimpo-conversation-g3.test.mjs
          node --test runtime-host/RealTalent-Agent-Runtime-V3.1.2/crm-deep-research-v60.test.mjs
          node --test scripts/garimpo-runtime-isolation.test.mjs
      - name: Runtime and installer
        run: |
          node --check runtime-host/RealTalent-Agent-Runtime-V3.1.2/gateway-ollama.mjs
          node --check runtime-host/RealTalent-Agent-Runtime-V3.1.2/crm-prospect-investigation-g1.mjs
          node --check runtime-host/RealTalent-Agent-Runtime-V3.1.2/crm-garimpo-conversation-g3.mjs
          bash -n scripts/garimpo-g1g2-linux/abrir-local.sh
          bash -n scripts/garimpo-g1g2-linux/abrir-com-diagnostico.sh
          bash -n scripts/garimpo-g1g2-linux/diagnosticar-runtime.sh
          grep -q 'PIPESTATUS\[0\]' scripts/garimpo-g1g2-linux/abrir-com-diagnostico.sh
          grep -q 'ultimo-inicio.log' scripts/garimpo-g1g2-linux/abrir-com-diagnostico.sh
          grep -q -- '--port 4197 --strictPort' scripts/garimpo-g1g2-linux/abrir-local.sh
          grep -q 'node scripts/start.mjs --garimpo' scripts/garimpo-g1g2-linux/abrir-local.sh
          grep -q 'for service_port in "$RT_CONNECT_PORT" "$RT_COMM_PORT" "$RT_CONTROL_PORT"' scripts/garimpo-g1g2-linux/abrir-local.sh
          node --check scripts/start.mjs
          node --check scripts/garimpo-runtime-isolation.test.mjs
          grep -q -- 'node scripts/realtalent-prospecting-agent.mjs' scripts/garimpo-g1g2-linux/abrir-local.sh
          grep -q -- '/api/prospecting-agent/health' scripts/garimpo-g1g2-linux/abrir-local.sh
          grep -q -- 'VITE_PROSPECTING_GATEWAY_URL=' scripts/garimpo-g1g2-linux/abrir-local.sh
          grep -q -- 'PROSPECTING_STATE_DIR=' scripts/garimpo-g1g2-linux/abrir-local.sh
      - name: Build
        run: npm run build
