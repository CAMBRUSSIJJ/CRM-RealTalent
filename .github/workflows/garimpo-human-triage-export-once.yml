name: Export Garimpo Human Triage ZIP
on:
  push:
    branches:
      - preview/garimpo-human-source-triage
    paths:
      - .github/workflows/garimpo-human-triage-export-once.yml
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/garimpo-human-source-triage
          fetch-depth: 0
      - name: Verify source and tests
        shell: bash
        run: |
          node scripts/prospecting-human-review-audit.mjs
          npm ci --include=dev
          npm run typecheck
          npm run qa:prospecting:functional
          npx vite build
      - name: Package only changed CRM files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,zipfile,hashlib,json
          base='147dd8760bc4a74353e7f373e12c48de802565cf'
          paths=[p for p in subprocess.check_output(['git','diff','--name-only','--diff-filter=ACM',base,'HEAD']).decode().splitlines() if p.startswith(('src/','scripts/')) and Path(p).is_file()]
          assert len(paths)>=4,paths
          out=Path('downloads/RealTalent-Garimpo-Revisao-Fontes-Brutas.zip')
          out.parent.mkdir(parents=True,exist_ok=True)
          instructions='''REAL TALENT - REVISAO DE FONTES BRUTAS
          
          Pacote complementar para base Preview 147dd876.
          Nao e o CRM completo.
          1. Extraia o CRM original numa pasta.
          2. Extraia este ZIP na raiz do CRM e sobrescreva os arquivos correspondentes.
          3. Preserve as pastas src/ e scripts/; NAO mova para dist/.
          4. Execute npm ci, npm run typecheck, npm run qa:prospecting:functional e npm run build no ambiente configurado.
          5. Recompacte a pasta completa em um novo ZIP.
          
          O runtime precisa possuir sourceLog (implementado na versao base).
          Decisoes de ignorar/promover fontes sao guardadas localmente no navegador
          e nao sincronizadas entre dispositivos.
          A Production nao e alterada por este pacote.
          '''
          manifest={'base_commit':base,'source_commit':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),
              'files':[{'path':p,'sha256':hashlib.sha256(Path(p).read_bytes()).hexdigest()} for p in paths]}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=8) as z:
            for p in paths:z.write(p,p)
            z.writestr('LEIA-ME-REVISAO-FONTES.txt',instructions)
            z.writestr('MANIFESTO-ARQUIVOS.json',json.dumps(manifest,ensure_ascii=False,indent=2))
          with zipfile.ZipFile(out) as z:assert z.testzip() is None
          print('ZIP pronto:',out,'bytes:',out.stat().st_size,'arquivos:',paths)
          PY
      - name: Commit ZIP and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/garimpo-human-triage-export-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build(garimpo): human source triage ZIP"
          git push origin HEAD:preview/garimpo-human-source-triage
