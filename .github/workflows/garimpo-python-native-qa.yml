name: Garimpo Python — End-to-end Contract QA
on:
  push:
    branches: [feat/garimpo-python-native-functional-20261117]
  pull_request:
    branches: [feat/garimpo-essential-no-ai-preview-20261117]
permissions:
  contents: read
jobs:
  python-and-crm:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3 engine tests
        run: |
          python3 -m unittest discover -s deploy/local-garimpo -p test_garimpo_python.py -v
          python3 -m py_compile deploy/local-garimpo/garimpo_engine.py deploy/local-garimpo/garimpo_connector.py
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install CRM
        run: npm ci --include=dev
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Linux installer regression
        run: npx vitest run src/services/local-connector-installer.test.ts
      - name: Connector regressions
        working-directory: deploy/local-garimpo
        run: |
          npm ci --include=dev
          npm test
