name: Garimpo Trigger Intelligence G4 - QA
on:
  push:
    branches:
      - feat/garimpo-trigger-intelligence-g4-20261106
  pull_request:
    paths:
      - 'src/services/prospecting-triggers-g4*'
      - 'src/features/prospecting/prospecting-trigger-g4*'
      - 'src/features/prospecting/prospecting-page.tsx'
      - 'runtime-host/RealTalent-Agent-Runtime-V3.1.2/crm-trigger-events-g4*'
      - 'runtime-host/RealTalent-Agent-Runtime-V3.1.2/gateway-ollama.mjs'
      - '.github/workflows/garimpo-trigger-g4-qa.yml'
  workflow_dispatch:
jobs:
  trigger-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Backend G4 security and evidence test
        run: node --test runtime-host/RealTalent-Agent-Runtime-V3.1.2/crm-trigger-events-g4.test.mjs
      - name: G4 review frontend tests
        run: npm exec -- vitest run src/services/prospecting-triggers-g4.test.ts
      - name: G1 and G2 regression
        run: npm exec -- vitest run src/services/prospecting-g1g2-intelligence.test.ts src/services/prospecting-workspace.test.ts
      - name: Agent syntax
        run: node --check runtime-host/RealTalent-Agent-Runtime-V3.1.2/gateway-ollama.mjs
      - name: TypeScript validation
        run: npm run typecheck
      - name: Build CRM
        run: npm run build
