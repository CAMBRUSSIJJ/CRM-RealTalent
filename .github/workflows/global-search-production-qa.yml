name: RealTalent Global Search Production QA
on:
  pull_request:
    branches:
      - feat/tasks-team-recipient-routing-20261102
    paths:
      - 'src/components/layout/topbar.tsx'
      - 'src/components/layout/global-search-popover.tsx'
      - 'src/styles/global-search-popover.css'
      - 'src/main.tsx'
      - 'scripts/global-search-production-qa.test.mjs'
      - '.github/workflows/global-search-production-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - name: Global search focus, portal and CSS QA
        run: node --test scripts/global-search-production-qa.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Full build
        run: npm run build
