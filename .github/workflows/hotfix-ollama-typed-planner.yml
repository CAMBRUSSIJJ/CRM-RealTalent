name: Hotfix Ollama Typed Planner

on:
  push:
    branches: ["runtime/v3.5-h1"]
    paths:
      - ".github/workflows/hotfix-ollama-typed-planner.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime/v3.5-h1
          fetch-depth: 0
      - name: Patch Agent cloud planner
        shell: python
        run: |
          from pathlib import Path

          p = Path('runtime-host/RealTalent-Agent-Runtime-V3.1.2/gateway.mjs')
          s = p.read_text()

          old_timeout = "timeoutMs:15_000,taskType:'classification'"
          new_timeout = "timeoutMs:Number(process.env.REALTALENT_AI_CLASSIFICATION_TIMEOUT_MS||45_000),taskType:'classification'"
          if old_timeout not in s:
              raise SystemExit('classification timeout marker not found')
          s = s.replace(old_timeout, new_timeout)

          marker = "async function planCrmCapabilities({prompt='',context={},capabilities=[]}={}) {"
          if marker not in s:
              raise SystemExit('planner marker not found')

          helper = r'''
const plannerText = (value='') => String(value ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()
const plannerMetricFromPrompt = (prompt='') => {
  const t=plannerText(prompt)
  const rules=[
    ['calls',/\b(ligacao|ligacoes|chamada|chamadas|telefonema|telefonemas|calls?)\b/],
    ['contacts',/\b(contato|contatos|contacts?)\b/],
    ['followups',/\b(follow[ -]?up|follow[ -]?ups|retorno|retornos)\b/],
    ['meetings',/\b(reuniao|reunioes|meeting|meetings)\b/],
    ['proposals',/\b(proposta|propostas|proposal|proposals)\b/],
    ['wins',/\b(venda|vendas|ganho|ganhos|wins?)\b/],
    ['revenue',/\b(receita|faturamento|revenue)\b/],
    ['new_leads',/\b(novos? leads?|lead|leads)\b/],
  ]
  for(const [metric,re] of rules) if(re.test(t)) return metric
  return ''
}
const plannerDateFromPrompt = (prompt='',context={}) => {
  const raw=String(prompt||'')
  const dmy=raw.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/)
  if(dmy)return `${dmy[3]}-${String(dmy[2]).padStart(2,'0')}-${String(dmy[1]).padStart(2,'0')}`
  const iso=raw.match(/\b(\d{4})-(\d{2})-(\d{2})\b/)
  if(iso)return `${iso[1]}-${iso[2]}-${iso[3]}`
  const t=plannerText(raw)
  const base=new Date(context?.now||Date.now())
  if(Number.isNaN(base.getTime()))return ''
  const zone=String(context?.timezone||'America/Sao_Paulo')
  const dateInZone=(d)=>{const parts=new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);const m=Object.fromEntries(parts.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return `${m.year}-${m.month}-${m.day}`}
  if(/\bamanha\b/.test(t))return dateInZone(new Date(base.getTime()+86400000))
  if(/\bhoje\b/.test(t))return dateInZone(base)
  return ''
}
const plannerTargetFromPrompt = (prompt='') => {
  const raw=String(prompt||'').replace(/\b\d{1,2}\/\d{1,2}\/\d{4}\b/g,' ').replace(/\b\d{4}-\d{2}-\d{2}\b/g,' ')
  const t=plannerText(raw)
  const patterns=[
    /\bmeta(?:s)?(?:\s+de)?\s+(\d+(?:[.,]\d+)?)/,
    /\b(\d+(?:[.,]\d+)?)\s+(?:ligacao|ligacoes|chamada|chamadas|contato|contatos|follow[ -]?ups?|reuniao|reunioes|proposta|propostas|venda|vendas|leads?)\b/,
    /\b(?:quero|crie|criar|defina|definir|estabeleca|estabelecer)\s+(\d+(?:[.,]\d+)?)/,
  ]
  for(const re of patterns){const m=t.match(re);if(m)return m[1].replace(',','.')}
  return ''
}
const plannerArgsObject = (items=[]) => Object.fromEntries((Array.isArray(items)?items:[]).filter(x=>x&&x.name).map(x=>[String(x.name),String(x.value??'')]))
const plannerArgsList = (obj={}) => Object.entries(obj).filter(([,v])=>String(v??'').trim()!=='').map(([name,value])=>({name,value:String(value)}))
const repairTypedCrmPlan = (plan,{prompt='',context={},catalog=[]}={}) => {
  if(!plan||typeof plan!=='object')return plan
  const steps=Array.isArray(plan.steps)?plan.steps:[]
  const goalStep=steps.find(step=>step?.capabilityId==='goals.create')
  if(!goalStep)return plan
  if(!(Array.isArray(catalog)&&catalog.some(item=>item?.id==='goals.create')))return plan

  const inherited=plannerArgsObject(context?.pending_capability?.knownArgs)
  const modelArgs={...plannerArgsObject(plan.knownArgs),...plannerArgsObject(goalStep.args)}
  const canonicalMetrics=new Set(['calls','contacts','followups','meetings','proposals','wins','revenue','new_leads'])
  const metric=plannerMetricFromPrompt(prompt)||(canonicalMetrics.has(modelArgs.metric)?modelArgs.metric:'')||(canonicalMetrics.has(inherited.metric)?inherited.metric:'')
  const target=plannerTargetFromPrompt(prompt)||(/^\d+(?:\.\d+)?$/.test(modelArgs.target_value||'')?modelArgs.target_value:'')||(/^\d+(?:\.\d+)?$/.test(inherited.target_value||'')?inherited.target_value:'')
  const periodStart=plannerDateFromPrompt(prompt,context)||(/^\d{4}-\d{2}-\d{2}$/.test(modelArgs.period_start||'')?modelArgs.period_start:'')||(/^\d{4}-\d{2}-\d{2}$/.test(inherited.period_start||'')?inherited.period_start:'')
  const periodEnd=(/^\d{4}-\d{2}-\d{2}$/.test(modelArgs.period_end||'')?modelArgs.period_end:'')||(/^\d{4}-\d{2}-\d{2}$/.test(inherited.period_end||'')?inherited.period_end:'')||periodStart
  const scope=['user','team','organization'].includes(modelArgs.scope)?modelArgs.scope:(['user','team','organization'].includes(inherited.scope)?inherited.scope:'user')
  const args={metric,target_value:target,period_start:periodStart,period_end:periodEnd,scope}
  const missing=[]
  if(!metric)missing.push('metric')
  if(!target)missing.push('target_value')
  if(!periodStart)missing.push('period_start')
  const argsList=plannerArgsList(args)

  goalStep.args=argsList
  plan.knownArgs=argsList
  plan.missingSlots=missing
  plan.pendingCapabilityId=missing.length?'goals.create':''
  plan.needsClarification=missing.length>0
  if(missing.length){
    const first=missing[0]
    plan.clarification=first==='metric'?'Qual tipo de meta você quer criar? Ligações, contatos, follow-ups, reuniões, propostas, vendas, receita ou novos leads?':first==='target_value'?'Qual é o valor da meta?':'Para qual data ou período você quer essa meta?'
    plan.confidence=Math.max(0.75,Math.min(Number(plan.confidence)||0.75,0.92))
  }else{
    plan.clarification=''
    plan.confidence=Math.max(Number(plan.confidence)||0,0.95)
    const labels={calls:'ligações',contacts:'contatos',followups:'follow-ups',meetings:'reuniões',proposals:'propostas',wins:'vendas',revenue:'receita',new_leads:'novos leads'}
    plan.goal=`Criar meta de ${target} ${labels[metric]||metric} para ${periodStart}`
  }
  return plan
}

'''
          s = s.replace(marker, helper + marker, 1)

          old_norm = "const plan=normalizeCrmCapabilityPlan(response.result,catalog)\n  return {plan,decision:crmCapabilityDecision(plan),provider:response.provider,model:response.model,modelRole:response.modelRole||'classification'}"
          new_norm = "const plan=repairTypedCrmPlan(normalizeCrmCapabilityPlan(response.result,catalog),{prompt,context,catalog})\n  return {plan,decision:crmCapabilityDecision(plan),provider:response.provider,model:response.model,modelRole:response.modelRole||'classification'}"
          if old_norm not in s:
              raise SystemExit('planner normalization marker not found')
          s = s.replace(old_norm, new_norm, 1)

          p.write_text(s)

          wf = Path('.github/workflows/hotfix-ollama-typed-planner.yml')
          wf.unlink()
      - name: Commit hotfix
        run: |
          git config user.name "realtalent-runtime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "runtime: harden Ollama typed planner and cloud timeout"
          git push origin HEAD:runtime/v3.5-h1
