name: Hotfix Runtime AI Bridge

on:
  push:
    branches: [runtime/v3.5-h1]
    paths:
      - '.github/workflows/hotfix-runtime-ai-bridge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime/v3.5-h1
          fetch-depth: 0
      - name: Patch cloud model transport
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('runtime-host/RealTalent-Agent-Runtime-V3.1.2/gateway.mjs')
          s=p.read_text()
          old="""const OPENAI_API_KEY = process.env.OPENAI_API_KEY || ''\nconst OPENAI_MODEL = process.env.OPENAI_MODEL || 'gpt-5.6-sol'\n"""
          new="""const OPENAI_API_KEY = process.env.OPENAI_API_KEY || ''\nconst OPENAI_MODEL = process.env.OPENAI_MODEL || 'gpt-5.6-sol'\nconst OPENAI_RESPONSES_URL = String(process.env.OPENAI_RESPONSES_URL || 'https://api.openai.com/v1/responses').trim()\nconst OPENAI_PROTECTION_BYPASS = String(process.env.OPENAI_PROTECTION_BYPASS || '').trim()\n"""
          if old not in s: raise SystemExit('openai constants marker not found')
          s=s.replace(old,new,1)
          old_fetch="""    const response = await fetch('https://api.openai.com/v1/responses', {\n      method: 'POST', headers: { 'Authorization': `Bearer ${OPENAI_API_KEY}`, 'Content-Type': 'application/json' }, signal: controller.signal,\n      body: JSON.stringify({ model: OPENAI_MODEL, instructions, input, text: { format: { type: 'json_schema', name, strict: true, schema } }, max_output_tokens: maxOutputTokens }),\n    })\n"""
          new_fetch="""    const openaiHeaders = { 'Authorization': `Bearer ${OPENAI_API_KEY}`, 'Content-Type': 'application/json' }\n    if (OPENAI_PROTECTION_BYPASS) openaiHeaders['x-vercel-protection-bypass'] = OPENAI_PROTECTION_BYPASS\n    const response = await fetch(OPENAI_RESPONSES_URL, {\n      method: 'POST', headers: openaiHeaders, signal: controller.signal,\n      body: JSON.stringify({ model: OPENAI_MODEL, instructions, input, text: { format: { type: 'json_schema', name, strict: true, schema } }, max_output_tokens: maxOutputTokens }),\n    })\n"""
          if old_fetch not in s: raise SystemExit('openai fetch marker not found')
          s=s.replace(old_fetch,new_fetch,1)
          p.write_text(s)

          a=Path('runtime-host/RealTalent-Agent-Runtime-V3.1.2/audit.mjs')
          t=a.read_text()
          t=t.replace("gateway.includes('https://api.openai.com/v1/responses')", "gateway.includes('OPENAI_RESPONSES_URL') && gateway.includes('https://api.openai.com/v1/responses')")
          a.write_text(t)
          PY

          node --check runtime-host/RealTalent-Agent-Runtime-V3.1.2/gateway.mjs
          node --check runtime-host/RealTalent-Agent-Runtime-V3.1.2/cloud-agent-gateway.mjs
          node runtime-host/RealTalent-Agent-Runtime-V3.1.2/audit.mjs

          rm -f .github/workflows/hotfix-runtime-ai-bridge.yml
          git config user.name 'RealTalent Release Bot'
          git config user.email 'realtalent-release@users.noreply.github.com'
          git add runtime-host/RealTalent-Agent-Runtime-V3.1.2/gateway.mjs runtime-host/RealTalent-Agent-Runtime-V3.1.2/audit.mjs .github/workflows/hotfix-runtime-ai-bridge.yml
          git commit -m 'runtime: support authenticated OpenAI-compatible AI bridge'
          git push origin HEAD:runtime/v3.5-h1
