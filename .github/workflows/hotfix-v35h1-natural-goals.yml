name: Hotfix V3.5-H1 Natural Goals

on:
  push:
    branches: [preview/v3.5-h1]
    paths:
      - '.github/workflows/hotfix-v35h1-natural-goals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/v3.5-h1
          fetch-depth: 0
      - name: Apply focused planner hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/services/realtalent-crm-capability-planner.ts')
          s = p.read_text()

          old_date = """const relativeDateArg = (text: string, now = new Date()) => {\n  const base = new Date(now); base.setHours(12, 0, 0, 0)\n  if (/\\bamanha\\b/.test(text)) { base.setDate(base.getDate() + 1); return dateKey(base) }\n"""
          new_date = """const relativeDateArg = (text: string, now = new Date()) => {\n  const explicitBr = text.match(/\\b(\\d{1,2})[\\/-](\\d{1,2})[\\/-](\\d{4})\\b/)\n  if (explicitBr) {\n    const day = Number(explicitBr[1]); const month = Number(explicitBr[2]); const year = Number(explicitBr[3])\n    const parsed = new Date(year, month - 1, day, 12, 0, 0, 0)\n    if (parsed.getFullYear() === year && parsed.getMonth() === month - 1 && parsed.getDate() === day) return dateKey(parsed)\n  }\n  const explicitIso = text.match(/\\b(\\d{4})-(\\d{2})-(\\d{2})\\b/)\n  if (explicitIso) {\n    const year = Number(explicitIso[1]); const month = Number(explicitIso[2]); const day = Number(explicitIso[3])\n    const parsed = new Date(year, month - 1, day, 12, 0, 0, 0)\n    if (parsed.getFullYear() === year && parsed.getMonth() === month - 1 && parsed.getDate() === day) return dateKey(parsed)\n  }\n  const base = new Date(now); base.setHours(12, 0, 0, 0)\n  if (/\\bamanha\\b/.test(text)) { base.setDate(base.getDate() + 1); return dateKey(base) }\n"""
          if old_date not in s:
              raise SystemExit('date marker not found')
          s = s.replace(old_date, new_date, 1)

          old_goal = """  const goalVerb = /\\b(cri|coloc|defin|estabelec|quero|bota|faz)\\w*/.test(text)\n  const implicitGoalOnGoalsPage = context.currentRoute === 'goals' && goalVerb && Boolean(goalMetricFromText(text)) && /\\b\\d+(?:[.,]\\d+)?\\b/.test(text)\n  const goalIntent = (/\\b(metas?|objetivos?|alvos?)\\b/.test(text) && goalVerb) || implicitGoalOnGoalsPage\n"""
          new_goal = """  const goalVerb = /\\b(cri|coloc|defin|estabelec|quero|bota|faz)\\w*/.test(text)\n  const mentionsGoal = /\\b(metas?|objetivos?|alvos?)\\b/.test(text)\n  const hasGoalMetric = Boolean(goalMetricFromText(text))\n  const hasGoalNumber = /\\b\\d+(?:[.,]\\d+)?\\b/.test(text)\n  const looksLikeReadQuestion = /\\b(qual|quais|quanto|quantas|como|onde|quem|por que|porque|mostre|mostrar|ver|veja|consulte|consultar)\\b/.test(text)\n  const declarativeGoal = mentionsGoal && hasGoalMetric && hasGoalNumber && !looksLikeReadQuestion\n  const implicitGoalOnGoalsPage = context.currentRoute === 'goals' && goalVerb && hasGoalMetric && hasGoalNumber\n  const goalIntent = (mentionsGoal && goalVerb) || declarativeGoal || implicitGoalOnGoalsPage\n"""
          if old_goal not in s:
              raise SystemExit('goal marker not found')
          s = s.replace(old_goal, new_goal, 1)
          p.write_text(s)
          PY

          rm -f .github/workflows/hotfix-v35h1-natural-goals.yml
          git config user.name 'RealTalent Release Bot'
          git config user.email 'realtalent-release@users.noreply.github.com'
          git add src/services/realtalent-crm-capability-planner.ts .github/workflows/hotfix-v35h1-natural-goals.yml
          git commit -m 'fix: accept declarative goals and explicit dates in Agent planner'
          git push origin HEAD:preview/v3.5-h1
