name: Materialize V3.5-H1 Preview

on:
  push:
    branches:
      - preview/v3.5-h1
    paths:
      - .github/workflows/materialize-v35h1-preview.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/v3.5-h1
          fetch-depth: 0

      - name: Download authoritative V3.5-H1 package
        env:
          SOURCE_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-9904-820e-845b-83747492b8d2/raw?se=2026-10-15T18%3A25%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=432d5ead-b5d7-5e58-810a-7a0774f1cf64&skoid=ba7c401a-35d6-40a0-a0f3-2259cc50bbe2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T11%3A01%3A04Z&ske=2026-10-16T11%3A01%3A04Z&sks=b&skv=2026-02-06&sig=aDPdZ%2Bp4WRj2k7bmeKTwzKTgJOwoFbQarQMUh0B3b/8%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o /tmp/realtalent-v35h1.tar.gz
          mkdir -p /tmp/realtalent-v35h1
          tar -xzf /tmp/realtalent-v35h1.tar.gz -C /tmp/realtalent-v35h1
          test -f /tmp/realtalent-v35h1/package.json
          test -f /tmp/realtalent-v35h1/package-lock.json
          test -d /tmp/realtalent-v35h1/src
          test -d /tmp/realtalent-v35h1/api
          test -d /tmp/realtalent-v35h1/public
          test -f /tmp/realtalent-v35h1/vercel.json

      - name: Replace branch with exact preview source
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/realtalent-v35h1/. .
          test -f package.json
          test -f package-lock.json
          test -d src
          test -d api
          test -d public
          test -f vercel.json

      - name: Commit exact V3.5-H1 preview tree
        run: |
          set -euo pipefail
          git config user.name "RealTalent Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Preview branch already matches the package."
            exit 0
          fi
          git commit -m "preview: RealTalent V3.5-H1 authoritative source"
          git push origin HEAD:preview/v3.5-h1
