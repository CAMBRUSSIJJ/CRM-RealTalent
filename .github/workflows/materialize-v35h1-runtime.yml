name: Materialize V3.5-H1 Railway Runtime

on:
  push:
    branches:
      - runtime/v3.5-h1
    paths:
      - .github/workflows/materialize-v35h1-runtime.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime/v3.5-h1
          fetch-depth: 0
      - name: Materialize authoritative runtime host
        env:
          RUNTIME_URL: "https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-6ca8-820c-9298-f275a13f7194/raw?se=2026-10-15T18%3A50%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=f12d36ff-e316-5225-b1c4-75fc927d9dec&skoid=ba7c401a-35d6-40a0-a0f3-2259cc50bbe2&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T10%3A07%3A25Z&ske=2026-10-16T10%3A07%3A25Z&sks=b&skv=2026-02-06&sig=bnHjJWq2cQlV4DIc%2BZRnUA9%2Bzsf2Vca0QCA8F674n9c%3D"
          EXPECTED_SHA256: "13d83154fa524309a401c264d4cbd3bb31554c6d5eb989277a72adf4103a301e"
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$RUNTIME_URL" -o /tmp/runtime.tar.gz
          echo "$EXPECTED_SHA256  /tmp/runtime.tar.gz" | sha256sum -c -
          rm -rf runtime-host
          mkdir -p runtime-host
          tar -xzf /tmp/runtime.tar.gz -C runtime-host
          test -f runtime-host/deploy/cloud-runtime/Dockerfile
          test -f runtime-host/deploy/cloud-runtime/cloud-runtime-supervisor.mjs
          test -f runtime-host/RealTalent-Agent-Runtime-V3.1.2/gateway.mjs
          test -f runtime-host/RealTalent-CRM-V101.11.3-CR10-H1-Agent-V3.1.2-Linux-Launcher/scripts/realtalent-communications-gateway.mjs
          test -f runtime-host/RealTalent-CRM-V101.11.3-CR10-H1-Agent-V3.1.2-Linux-Launcher/scripts/realtalent-prospecting-agent.mjs
      - name: Commit runtime source once
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-v35h1-runtime.yml
          git config user.name "RealTalent Runtime Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A runtime-host .github/workflows/materialize-v35h1-runtime.yml
          git commit -m "runtime: materialize V3.5-H1 persistent host"
          git push origin HEAD:runtime/v3.5-h1
