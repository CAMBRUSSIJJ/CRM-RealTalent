name: Preview Agent CI

on:
  push:
    branches:
      - preview/v3.5-h1-semantic-agent
    paths:
      - 'src/repositories/**'
      - 'src/services/realtalent-*.ts'
      - 'src/services/prospecting-*.ts'
      - 'src/features/prospecting/**'
      - 'src/features/assistant/**'
      - 'src/features/auth/**'
      - 'src/lib/env.ts'
      - 'src/lib/env.test.ts'
      - 'scripts/local-staging.sh'
      - 'scripts/local-staging-bootstrap.mjs'
      - 'scripts/local-staging-communication-fixture.mjs'
      - 'scripts/local-staging-workspace-probe.mjs'
      - 'scripts/commercial_readiness_cr2_staging_probe.mjs'
      - 'scripts/commercial_readiness_cr3_staging_e2e_probe.mjs'
      - 'scripts/security_definer_anon_probe.mjs'
      - 'scripts/v101_11_2_teams_tasks_foundation_audit.mjs'
      - '.env.cr3.example'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/migrations.lock.json'
      - 'supabase/seed.sql'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/preview-agent-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Local staging static gate
        run: |
          bash -n scripts/local-staging.sh
          node --check scripts/local-staging-bootstrap.mjs
          node --check scripts/local-staging-communication-fixture.mjs
          node --check scripts/local-staging-workspace-probe.mjs
          node --check scripts/commercial_readiness_cr2_staging_probe.mjs
          node --check scripts/commercial_readiness_cr3_staging_e2e_probe.mjs
          node --check scripts/security_definer_anon_probe.mjs
          grep -q "recusando endpoint não local" scripts/local-staging-bootstrap.mjs
          grep -q "recusou endpoint não local" scripts/local-staging-communication-fixture.mjs
          grep -q "CR3_COMMUNICATION_ACCOUNT_ID" .env.cr3.example
          grep -q "REALTALENT_SUPABASE_EXCLUDE_SERVICES" scripts/local-staging.sh
          grep -q "REALTALENT_SUPABASE_SKIP_RESET" scripts/local-staging.sh
          grep -q "claim_lead_geocode_jobs" supabase/migrations/202610160003_v101_11_3_h22_6_security_definer_execute_hardening.sql
          grep -q "get_buyer_room_public" scripts/security_definer_anon_probe.mjs
          grep -q "\.supabase-local-status\.env" .gitignore

      - name: Migration integrity
        run: npm run migrations:verify

      - name: Login gate regression
        run: npm run qa:v101.11.1:h1

      - name: Teams and Tasks forward-compatibility gate
        run: npm run qa:v101.11.2

      - name: Local Supabase environment regression
        run: npx vitest run src/lib/env.test.ts

      - name: Prospecting Intelligence regression
        run: npx vitest run src/services/prospecting-data-layer.test.ts src/services/prospecting-intelligence.test.ts src/services/prospecting-search-automation.test.ts

      - name: Garimpo Adaptive Search Learning 4.2 smoke
        run: node scripts/v101_11_3_h23_2_adaptive_search_learning_smoke.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Sales reference tests
        run: npx vitest run src/services/realtalent-sales-reference-resolver.test.ts src/services/realtalent-sales-intelligence-agent.test.ts

      - name: Build
        run: npm run build

  local-staging-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run lean local Supabase migrations + CR2 + security + CR3
        env:
          REALTALENT_SUPABASE_CLI_VERSION: '2.119.0'
          REALTALENT_SUPABASE_EXCLUDE_SERVICES: 'realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor'
          REALTALENT_SUPABASE_SKIP_RESET: '1'
        run: bash scripts/local-staging.sh all

      - name: Probe exact workspace hydration queries
        run: node scripts/local-staging-workspace-probe.mjs

      - name: Tear down disposable local staging
        if: always()
        env:
          REALTALENT_SUPABASE_CLI_VERSION: '2.119.0'
        run: bash scripts/local-staging.sh clean || true
