name: Preview Global Gate Fix

on:
  push:
    branches:
      - preview/v3.5-h1-semantic-agent

permissions:
  contents: write

jobs:
  apply-verified-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify base and apply patch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE="78a8c60fdb70dedf84ae8840b609bd92cf502e11"
          PATCH_SHA256="b363eeab2cc82fcce83b135c1d419453a401861c1f09f80b0328a29be2450769"
          CURRENT_PARENT="$(git rev-parse HEAD^)"
          if [ "$CURRENT_PARENT" != "$EXPECTED_BASE" ]; then
            echo "Branch parent changed; refusing to apply patch. Expected $EXPECTED_BASE, got $CURRENT_PARENT"
            exit 0
          fi
          curl --fail --silent --show-error --location \
            "https://sb-1ij10e7vhoys.vercel.run/f13.patch" \
            --output /tmp/f13.patch
          echo "$PATCH_SHA256  /tmp/f13.patch" | sha256sum --check --strict
          git apply --check /tmp/f13.patch
          git apply /tmp/f13.patch
          git config user.name "OpenAI Preview Gate"
          git config user.email "noreply@openai.com"
          git add \
            src/features/assistant/assistant-drawer.tsx \
            src/services/integration-framework.test.ts \
            src/services/realtalent-crm-execution-truth.ts \
            src/services/realtalent-crm-universal-executor.ts \
            src/services/realtalent-sales-intelligence-agent.ts \
            runtime-host/RealTalent-CRM-V101.11.3-CR10-H1-Agent-V3.1.2-Linux-Launcher/src/services/integration-framework.test.ts
          git diff --cached --check
          git commit -m "fix(agent): close universal execution truth gate"
          git push origin HEAD:preview/v3.5-h1-semantic-agent
