name: Promover V100.42 para produção

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Digite PROMOVER-V100.42
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  promote:
    if: ${{ inputs.confirmation == 'PROMOVER-V100.42' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      VITE_DATA_MODE: supabase
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_RELEASE_CHANNEL: production
      VITE_COMMIT_SHA: ${{ github.sha }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      STAGING_URL: ${{ secrets.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - run: npm run check:ci
      - name: Backup obrigatório antes da promoção
        run: npm run backup:database
      - name: Acionar deploy de produção
        run: curl --fail --silent --show-error --request POST "${{ secrets.VERCEL_PRODUCTION_DEPLOY_HOOK }}"
      - name: Aguardar health da produção
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            VERSION=$(curl -fsS "$STAGING_URL/health.json?attempt=$attempt" | python -c "import sys,json; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
            [ "$VERSION" = "100.42" ] && exit 0
            sleep 10
          done
          exit 1
      - run: npm run verify:staging
      - name: Criptografar backup para retenção curta
        shell: bash
        run: |
          DUMP=$(find backups -name '*.dump' -type f | head -1)
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}" --symmetric --cipher-algo AES256 "$DUMP"
          rm -f "$DUMP"
      - uses: actions/upload-artifact@v4
        with:
          name: backup-pre-release-v100-41
          path: backups
          if-no-files-found: error
          retention-days: 7
