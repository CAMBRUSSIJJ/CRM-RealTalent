name: Calling Operational Queue v2 QA
on:
  pull_request:
    paths:
      - 'src/features/calls/calls-page.tsx'
      - 'src/features/calls/calls-queue-reference-v2.css'
      - 'scripts/calling_queue_reference_v2_audit.mjs'
      - 'package.json'
      - '.github/workflows/qa-calling-queue-v2.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: New operational queue layout
        run: npm run qa:calling:queue-v2
      - name: Existing call focus and flow
        run: npm run qa:calling:focus-v2 && npm run qa:calling:flow
      - name: Legacy design system contract
        run: npm run qa:v101.11.3:h20.5
      - name: TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
