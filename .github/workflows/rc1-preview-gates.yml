name: RealTalent RC1 Preview gates
on:
  push:
    branches:
      - release/rc1-preview-foundation
      - release/rc1-h1-persistence-safety
  pull_request:
    branches:
      - preview/v3.5-h1-semantic-agent

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, Garimpo functional, release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: node scripts/rc1-preview-gate.mjs
      - run: npm run qa:prospecting:functional
      - run: node scripts/prospecting-human-review-audit.mjs
      - run: node scripts/rc1-h1-persistence-gate.mjs
      - run: npm test -- --reporter=dot
      - run: npx vite build
