name: RealTalent Live Sales Coach Publisher

on:
  push:
    branches:
      - preview/v3.5-h1-semantic-agent
    paths:
      - .github/workflows/realtalent-live-sales-coach-publish.yml

permissions:
  contents: write

jobs:
  apply-live-sales-coach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated Live Sales Coach patch
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f src/services/realtalent-live-sales-coach.ts ]]; then
            echo "Live Sales Coach already present; nothing to apply."
            exit 0
          fi
          curl -fsSL https://sb-6n4evzn2vbd4.vercel.run/live.patch.gz.b64 -o /tmp/live.patch.gz.b64
          echo "3c92b9a4d2b11f9ec9b4598e858bd73ad404ad9f0b760ed239d1a3f474073e32  /tmp/live.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/live.patch.gz.b64 | gzip -d > /tmp/live.patch
          git apply --index /tmp/live.patch
          git diff --cached --check
          git config user.name "CAMBRUSSIJJ"
          git config user.email "92959827+CAMBRUSSIJJ@users.noreply.github.com"
          git commit -m "feat(agent): add live sales coach v1"
          git push origin HEAD:preview/v3.5-h1-semantic-agent
