name: RealTalent Pending Slot Publisher

on:
  push:
    branches:
      - preview/v3.5-h1-semantic-agent
    paths:
      - .github/workflows/realtalent-pending-slot-publish.yml

permissions:
  contents: write

jobs:
  apply-pending-slot-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated pending slot patch
        shell: bash
        run: |
          set -Eeuo pipefail
          if git log -1 --format=%s | grep -q 'resume pending recommendation slots safely'; then
            echo "Pending slot fix already present; nothing to apply."
            exit 0
          fi
          curl -fsSL https://sb-77bid71ivdb5.vercel.run/pending-slot.patch.gz.b64 -o /tmp/pending-slot.patch.gz.b64
          echo "efafa00fc15b39e12d88b7e02ebe32fcbe2cb517ae8ab3ef54c69cbdc29e0acd  /tmp/pending-slot.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/pending-slot.patch.gz.b64 | gzip -d > /tmp/pending-slot.patch
          git apply --index /tmp/pending-slot.patch
          git diff --cached --check
          git config user.name "CAMBRUSSIJJ"
          git config user.email "92959827+CAMBRUSSIJJ@users.noreply.github.com"
          git commit -m "fix(agent): resume pending recommendation slots safely"
          git push origin HEAD:preview/v3.5-h1-semantic-agent
