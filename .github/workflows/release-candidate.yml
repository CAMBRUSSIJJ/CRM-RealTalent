name: Homologar candidato V100.42

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente protegido
        required: true
        default: staging
        type: choice
        options: [staging]

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  homologate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    env:
      VITE_DATA_MODE: supabase
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_RELEASE_CHANNEL: staging
      VITE_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r requirements-smoke.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run homologate
      - uses: actions/upload-artifact@v4
        with:
          name: realtalent-v100-41-homologado
          path: |
            dist
            REALTALENT-CRM-V100-42.html
            REALTALENT-CRM-V100-42-standalone.html
            HOMOLOGATION-REPORT-V100-42.json
            TESTE-SMOKE-V100-42.json
            DATABASE-AUDIT-V100-42.json
            PRE-FLIGHT-V100-42.json
            PRODUCTION-READINESS-V100-42.json
            RELEASE-MANIFEST-V100-42.json
          if-no-files-found: error
          retention-days: 30
