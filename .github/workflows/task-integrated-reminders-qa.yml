name: Task Integrated Reminders QA
on:
  push:
    branches:
      - feat/task-integrated-reminders-ux-20261102
  pull_request:
    paths:
      - 'src/features/tasks/**'
      - 'src/features/teams/**'
      - 'src/repositories/local-workspace-member-repository.ts'
      - 'src/features/settings/local-member-whatsapp-editor.tsx'
      - 'src/services/team-whatsapp-directory.ts'
      - 'scripts/local-team-whatsapp-contract.test.mjs'
      - 'scripts/local-task-whatsapp-scheduler.mjs'
      - 'scripts/local-task-whatsapp-scheduler.test.mjs'
      - 'scripts/realtalent-communications-gateway.mjs'
      - 'src/services/local-communications-gateway.ts'
      - 'src/features/settings/task-reminder-*'
      - 'src/services/work-management.ts'
      - 'src/services/task-reminder-*'
      - 'src/domain/types.ts'
      - 'supabase/migrations/*task_reminder*'
      - 'supabase/migrations/*team_member_notification_contacts*'
      - 'supabase/functions/task-reminder-*'
      - 'src/styles/task-reminders.css'
      - 'scripts/task-reminder-ui-contract.test.mjs'
      - 'scripts/team-notification-routing-contract.test.mjs'
permissions:
  contents: read
jobs:
  task-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: UI and RLS contract
        run: node --test scripts/task-reminder-ui-contract.test.mjs
      - name: Team contact and reminder routing contracts
        run: node --test scripts/team-notification-routing-contract.test.mjs
      - name: Local team phone and consent contracts
        run: node --test scripts/local-team-whatsapp-contract.test.mjs
      - name: Automatic local queue safety contracts
        run: node --test scripts/local-task-whatsapp-scheduler.test.mjs
      - name: Existing reminder security contracts
        run: node --test scripts/task-reminder-contract.test.mjs
      - name: CSS governance
        run: npm run css:governance
      - name: Application regression
        run: npx vitest run src --reporter=dot
      - name: TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
