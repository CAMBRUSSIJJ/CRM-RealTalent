name: WhatsApp Task Test In-CRM QA

on:
  push:
    branches:
      - feat/task-reminder-whatsapp-test-inside-crm-20261102
  pull_request:
    paths:
      - 'src/features/tasks/**'
      - 'src/services/task-reminder-whatsapp-test*'
      - '.github/workflows/task-whatsapp-in-crm-qa.yml'

permissions:
  contents: read

jobs:
  whatsapp-task-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: WhatsApp task test contracts
        run: npx vitest run src/services/task-reminder-whatsapp-test.test.ts --reporter=dot
      - name: Application regression
        run: npx vitest run src --reporter=dot
      - name: TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
