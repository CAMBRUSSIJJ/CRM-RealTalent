name: WhatsApp Task Test In-CRM QA

on:
  push:
    branches:
      - feat/task-reminder-whatsapp-test-inside-crm-20261102
  pull_request:
    paths:
      - 'src/features/tasks/**'
      - 'src/services/task-reminder-whatsapp-test*'
      - '.github/workflows/task-whatsapp-in-crm-qa.yml'

permissions:
  contents: read

jobs:
  whatsapp-task-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: CSS governance (dev startup)
        run: npm run css:governance
      - name: Linux dev launcher historical gates
        run: |
          set -e
          for gate in \
            qa:v101.10.8 \
            qa:v101.10.9 qa:v101.10.9:h4 qa:v101.10.9:h5 \
            qa:v101.11.0 \
            qa:v101.11.1 qa:v101.11.1:h1 qa:v101.11.1:h2 qa:v101.11.1:h3 qa:v101.11.1:h4 qa:v101.11.1:h5 \
            qa:v101.11.2 qa:v101.11.3 \
            qa:v101.11.3:h1 qa:v101.11.3:h2 qa:v101.11.3:h3 qa:v101.11.3:h4 \
            qa:v101.11.3:h5 qa:v101.11.3:h6 qa:v101.11.3:h7 qa:v101.11.3:h8 \
            qa:v101.11.3:h9 qa:v101.11.3:h10 qa:v101.11.3:h11 qa:v101.11.3:h12 \
            qa:v101.11.3:h13 qa:v101.11.3:h14 qa:v101.11.3:h14:ui1 qa:v101.11.3:h15
          do
            npm run "$gate"
          done
      - name: QR bridge JavaScript syntax
        run: node --check scripts/whatsapp-browser-qr-bridge.mjs
      - name: WhatsApp LID addressing (no external sends)
        run: node --test scripts/whatsapp-lid-addressing.test.mjs
      - name: WhatsApp task test contracts
        run: npx vitest run src/services/task-reminder-whatsapp-test.test.ts --reporter=dot
      - name: Application regression
        run: npx vitest run src --reporter=dot
      - name: TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
