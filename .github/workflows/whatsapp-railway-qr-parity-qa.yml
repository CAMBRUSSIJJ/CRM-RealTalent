name: WhatsApp QR Railway Runtime Parity QA

on:
  push:
    branches:
      - fix/whatsapp-qr-runtime-parity-20261104
  pull_request:
    paths:
      - 'scripts/railway-qr-bundle-parity.test.mjs'
      - 'scripts/whatsapp-browser-qr-bridge.mjs'
      - 'scripts/whatsapp-lid-addressing.mjs'
      - 'scripts/whatsapp-web-send-result-hotfix.mjs'
      - 'runtime-host/**/scripts/whatsapp-browser-qr-bridge.mjs'
      - 'runtime-host/**/scripts/whatsapp-lid-addressing.mjs'
      - 'runtime-host/**/scripts/whatsapp-web-send-result-hotfix.mjs'
      - 'runtime-host/**/scripts/realtalent-communications-gateway.mjs'
      - '.github/workflows/whatsapp-railway-qr-parity-qa.yml'

permissions:
  contents: read

jobs:
  verify-hosted-qr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exact locked project dependencies
        run: npm ci --include=dev --no-fund --no-audit
      - name: Validate QR expiry behavior without connecting a WhatsApp phone
        run: node --test scripts/whatsapp-qr-recovery-policy.test.mjs
      - name: Validate hosted WhatsApp integration contracts
        run: node --test scripts/hosted-whatsapp-qr-regression.test.mjs scripts/communications-qr-live-contract.test.mjs
      - name: Validate CRM TypeScript and production build
        run: |
          npm run typecheck
          npm run build
      - name: Validate browser bridge and helpers syntax
        run: |
          node --check scripts/whatsapp-browser-qr-bridge.mjs
          node --check runtime-host/RealTalent-CRM-V101.11.3-CR10-H1-Agent-V3.1.2-Linux-Launcher/scripts/whatsapp-browser-qr-bridge.mjs
          node --check runtime-host/RealTalent-CRM-V101.11.3-CR10-H1-Agent-V3.1.2-Linux-Launcher/scripts/whatsapp-lid-addressing.mjs
          node --check runtime-host/RealTalent-CRM-V101.11.3-CR10-H1-Agent-V3.1.2-Linux-Launcher/scripts/whatsapp-web-send-result-hotfix.mjs
      - name: Validate isolated QA supervisor syntax
        run: node --check deploy/whatsapp-qr-qa/qa-supervisor.mjs
      - name: Verify QA service never permits outbound messages
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const s=fs.readFileSync('deploy/whatsapp-qr-qa/qa-supervisor.mjs','utf8'); assert.ok(s.includes('qa_read_only_route')); assert.ok(!s.includes(\"'POST /api/communications/send'\")); assert.ok(s.includes('REALTALENT_QA_WORKSPACE_ID'));"
      - name: Validate Railway hosted QR parity without sending WhatsApp messages
        run: node --test scripts/railway-qr-bundle-parity.test.mjs
      - name: Validate LID addressing and WhatsApp Web return compatibility
        run: node --test scripts/whatsapp-lid-addressing.test.mjs scripts/whatsapp-web-send-result-hotfix.test.mjs
