name: RealTalent WhatsApp Socket Readiness QA
on:
  push:
    branches: [fix/whatsapp-web-socket-readiness-20261105]
  pull_request:
    paths:
      - scripts/whatsapp-web-socket-readiness-hotfix.mjs
      - scripts/whatsapp-web-socket-readiness-hotfix.test.mjs
      - scripts/whatsapp-browser-qr-bridge.mjs
      - runtime-host/**/scripts/whatsapp-web-socket-readiness-hotfix.mjs
      - runtime-host/**/scripts/whatsapp-browser-qr-bridge.mjs
      - .github/workflows/whatsapp-socket-readiness-qa.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Test WAWebSocketModel startup guard, QR recovery and safety
        run: |
          node --test scripts/whatsapp-web-socket-readiness-hotfix.test.mjs scripts/whatsapp-qr-device-info-compat.test.mjs scripts/whatsapp-detached-frame-resilience.test.mjs scripts/chromium-profile-lock-recovery.test.mjs
          node --check scripts/whatsapp-web-socket-readiness-hotfix.mjs
          node --check scripts/whatsapp-browser-qr-bridge.mjs
      - name: Verify TypeScript and build
        run: |
          npm run typecheck
          npm run build
