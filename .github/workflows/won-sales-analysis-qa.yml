name: Won Sales Analysis - QA
on:
  push:
    branches:
      - feat/won-sales-trigger-analysis-20261106
  pull_request:
    paths:
      - 'src/services/won-sales-analysis*'
      - 'src/features/won-sales/**'
      - 'src/features/pipeline/pipeline-page.tsx'
      - 'src/features/metrics/metrics-page.tsx'
      - 'src/features/prospecting/prospecting-page.tsx'
      - 'src/features/won-sales/won-sales-analysis.css'
      - '.github/workflows/won-sales-analysis-qa.yml'
  workflow_dispatch:
jobs:
  won-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=dev
      - name: Won Sales evidence and analytics tests
        run: npm exec -- vitest run src/services/won-sales-analysis.test.ts
      - name: TypeScript check
        run: npm run typecheck
      - name: Build Vite
        run: npm run build
      - name: Related CRM pipeline contracts
        run: |
          npm exec -- vitest run src/features/pipeline/pipeline-preferences.test.ts
