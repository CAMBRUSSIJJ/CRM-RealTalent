# Apply after compose.override.yaml on a Linux computer with up to 10 GiB RAM.
services:
  api:
    cpus: 1.5
    mem_limit: 1800m
    memswap_limit: 2400m
    environment:
      CRAWL_CONCURRENT_REQUESTS: "1"
      BROWSER_POOL_SIZE: "1"
      # This Firecrawl revision starts 5 NuQ Node.js processes by default.
      # One is enough for the single-page economic mode (saves hundreds of MiB).
      NUQ_WORKER_COUNT: "1"
      # API may take longer than 60s to boot on a low-memory host.
      HARNESS_STARTUP_TIMEOUT_MS: "180000"
  playwright-service:
    cpus: 1.0
    mem_limit: 768m
    memswap_limit: 1024m
    environment:
      MAX_CONCURRENT_PAGES: "1"
  redis:
    mem_limit: 128m
    memswap_limit: 256m
  rabbitmq:
    mem_limit: 384m
    memswap_limit: 512m
  nuq-postgres:
    mem_limit: 384m
    memswap_limit: 512m
  searxng:
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 384m
