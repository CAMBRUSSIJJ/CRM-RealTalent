name: realtalent-whatsapp-local
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_DB: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Credenciais locais não geradas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 5s
  evolution:
    image: evoapicloud/evolution-api:v2.3.7@sha256:1bd8afc4a6cf48822e6cf02469aeae7bd35a12a6b616eacd1291926307f4d339
    restart: unless-stopped
    # Upstream QR fixes: force predictable DNS inside this container, not on
    # the whole computer. This does not remove or recreate any data volumes.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://127.0.0.1:8080
      # Baileys can fail initial WhatsApp Web handshakes when IPv6/DNS
      # selection stalls. Prefer IPv4 without disabling IPv6 system-wide.
      NODE_OPTIONS: "--dns-result-order=ipv4first --network-family-autoselection-attempt-timeout=1000"
      QRCODE_LIMIT: "12"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: realtalent_connect
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Credenciais locais não geradas}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      # Lightweight local cache avoids Redis round-trips during QR/pre-key
      # generation, per Evolution pairing workaround (issue #2437).
      CACHE_REDIS_ENABLED: "false"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: realtalent_local
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "true"
      # Keep new chats and contacts. Disable only expensive bulk history/labels
      # during initial pairing; old Railway history is never touched.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DEL_INSTANCE: "false"
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN
    volumes:
      - evolution_instances:/evolution/instances
volumes:
  postgres_data:
  redis_data:
  evolution_instances:
