# Configuração local do RealTalent CRM. Segredos não devem ser gravados neste arquivo.
project_id = "realtalent-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://localhost:4173/**", "http://127.0.0.1:4173/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[functions.extension-ingest]
verify_jwt = false

[functions.automation-runner]
verify_jwt = false

[functions.geocode-lead]
verify_jwt = true

[functions.maps-diagnostics]
verify_jwt = true

[functions.lead-geocode-worker]
verify_jwt = false

[functions.automation-webhook-dispatch]
verify_jwt = true

[functions.extension-register]
verify_jwt = true

[functions.client-diagnostics]
verify_jwt = true

[functions.official-communication-send]
verify_jwt = true

[functions.communication-dispatch-worker]
verify_jwt = false

[functions.communication-sync-worker]
verify_jwt = false

[functions.google-communications-webhook]
verify_jwt = false

[functions.microsoft-communications-webhook]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

# V100.45 — endpoints autenticados pelo usuário
[functions.integration-oauth-start]
verify_jwt = true

[functions.integration-account-test]
verify_jwt = true

[functions.integration-diagnostics]
verify_jwt = true

[functions.integration-account-revoke]
verify_jwt = true

# V100.45 — callbacks e workers protegidos por estado, assinatura ou segredo próprio
[functions.integration-oauth-callback]
verify_jwt = false

[functions.gmail-pubsub-webhook]
verify_jwt = false

[functions.integration-google-worker]
verify_jwt = false

[functions.integration-microsoft-worker]
verify_jwt = false

[functions.integration-meta-worker]
verify_jwt = false

[functions.integration-whatsapp-worker]
verify_jwt = false

[functions.integration-token-worker]
verify_jwt = false

[functions.integration-health-worker]
verify_jwt = false

[functions.integration-maintenance-worker]
verify_jwt = false
